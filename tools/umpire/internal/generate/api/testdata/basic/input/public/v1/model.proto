syntax = "proto3";

package fixture.public.v1;

import "legacy/v1/options.proto";
import "shared/v1/types.proto";

message Model {
  message Nested {
    enum State {
      STATE_UNSPECIFIED = 0;
      STATE_READY = 1 [deprecated = true];
    }

    State state = 1;
  }

  fixture.shared.v1.Shared shared = 1;
  map<string, fixture.shared.v1.Shared> attributes = 2;
  oneof choice {
    string text = 3;
    int64 number = 4;
  }
  optional string note = 5;
  bytes payload = 6;
  Nested nested = 7;
  fixture.legacy.v1.LegacyOptions legacy = 8;
}

message Reply {
  fixture.shared.v1.Shared shared = 1;
}
