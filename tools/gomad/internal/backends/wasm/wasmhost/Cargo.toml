[package]
name = "gomad-wasmhost"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[features]
conformance = ["serde_json/raw_value"]
diagnostic-profile = []
guest-profile = ["diagnostic-profile", "wasmtime/profiling", "wasmtime/call-hook"]
diagnostic-fuel-off = ["diagnostic-profile"]
stress-jitter = []

[dependencies]
wasmtime = { version = "=47.0.3", default-features = false, features = ["cranelift", "runtime", "std", "wat", "reexport-wasmparser"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", features = ["asm"] }
crc32fast = "=1.5.2"
base64 = "=0.22.1"
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
serde_json = { version = "=1.0.149", features = ["raw_value"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
fallible_impl_from = "warn"
needless_collect = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
