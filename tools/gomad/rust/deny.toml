# cargo-deny policy (mirrors umpire/temporal/model/deny.toml). Run
#   cargo deny --workspace check -D warnings
# when the tool is installed (needs network for advisories). Not part of the merge gate.
# Every lint below is set to deny, and `-D warnings` promotes any lint that cargo-deny
# only warns on (for example an unnecessary skip), so nothing scrolls past quietly.
[licenses]
# Only licenses the current tree actually uses; an unused allowance fails.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "Unicode-3.0", "Zlib"]
unused-allowed-license = "deny"
# Workspace crates are `publish = false` and carry no license field.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Intra-workspace path dependencies are not wildcards in any meaningful sense.
allow-wildcard-paths = true
# Known duplicates, pinned by exact version so a dependency bump that changes or
# removes one fails until this list is revisited.
skip = [
  { crate = "hashbrown@0.16.1", reason = "gimli 0.33 (wasmtime/cranelift) lags the 0.17 used by the rest of wasmtime" },
  { crate = "syn@2.0.119", reason = "serde_derive and wasmtime proc-macros are still on syn 2; thiserror/async-trait moved to syn 3" },
  { crate = "wasm-encoder@0.252.0", reason = "wasmtime-environ 47 pins 0.252; wast 261 (wat feature) pulls 0.261" },
]
# Unmaintained or superseded.
deny = [
  { name = "im", reason = "unmaintained since 2022; use imbl" },
  { name = "derivative", reason = "unmaintained since 2021; use std derives or educe" },
  { name = "proc-macro-error", reason = "unmaintained since 2020; use manyhow" },
  { name = "proc-macro-error2", reason = "no release since 2024; use manyhow" },
  { name = "deluxe", reason = "no release since 2023; use darling" },
  { name = "index_vec", reason = "no release since 2024; use typed-index-collections if needed" },
  { name = "stateright", reason = "single maintainer, stale; reference only" },
]

[advisories]
unmaintained = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
