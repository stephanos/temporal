[package]
name = "gomad"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
default-run = "gomad"

[[bin]]
name = "gomad-profile"
path = "src/bin/profile.rs"
required-features = ["helper-diagnostic-profile"]

[[bin]]
name = "gomad-measure"
path = "src/bin/measure.rs"

default-run = "gomad"

[features]
determinism-fixture = []
helper-diagnostic-profile = ["gomad-wasmhost/diagnostic-profile"]
helper-guest-profile = ["helper-diagnostic-profile", "gomad-wasmhost/guest-profile"]
helper-diagnostic-fuel-off = ["helper-diagnostic-profile", "gomad-wasmhost/diagnostic-fuel-off"]
helper-stress-jitter = ["gomad-wasmhost/stress-jitter"]
helper-determinism-fixture = ["gomad-wasmhost/determinism-fixture"]

[dependencies]
gomad-wasmhost = { path = "../wasmhost" }
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
rustix.workspace = true

[build-dependencies]
sha2.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
fallible_impl_from = "warn"
needless_collect = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
