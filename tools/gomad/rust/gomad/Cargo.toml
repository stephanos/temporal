[package]
name = "gomad"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

default-run = "gomad"

[features]
determinism-fixture = []
helper-stress-jitter = ["gomad-wasmhost/stress-jitter"]
helper-determinism-fixture = ["gomad-wasmhost/determinism-fixture"]

[dependencies]
gomad-wasmhost = { path = "../wasmhost" }
serde.workspace = true
serde_json = { workspace = true, features = ["unbounded_depth"] }
sha2.workspace = true
rustix.workspace = true

[build-dependencies]
sha2.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
fallible_impl_from = "warn"
needless_collect = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
