[package]
name = "gomad-wasmhost"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gomad-wasmhost"
path = "src/main.rs"
required-features = ["reference-helper"]

[features]
reference-helper = []
conformance = ["reference-helper", "serde_json/raw_value"]
diagnostic-profile = []
guest-profile = ["diagnostic-profile", "wasmtime/profiling", "wasmtime/call-hook"]
diagnostic-fuel-off = ["diagnostic-profile"]
stress-jitter = []
determinism-fixture = []

[dependencies]
wasmtime = { version = "=47.0.3", default-features = false, features = ["cranelift", "runtime", "std", "wat", "reexport-wasmparser"] }
serde.workspace = true
serde_json = "=1.0.149"
sha2.workspace = true
crc32fast = "=1.5.2"
base64 = "=0.22.1"
rustix.workspace = true

[dev-dependencies]
serde_json = { version = "=1.0.149", features = ["raw_value"] }

[build-dependencies]
sha2.workspace = true

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
fallible_impl_from = "warn"
needless_collect = "warn"
redundant_clone = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"

[[test]]
name = "engine"
required-features = ["reference-helper"]

[[test]]
name = "cluster"
required-features = ["reference-helper"]

[[test]]
name = "helper_corpus"
required-features = ["reference-helper"]

[[test]]
name = "replay_preflight"
required-features = ["reference-helper"]

[[test]]
name = "allocation_receiving"
path = "tests/allocation_receiving.rs"
harness = false
