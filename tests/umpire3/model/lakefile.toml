name = "umpire3"
defaultTargets = ["Umpire3", "Temporal", "Umpire3Tests", "Umpire3VeilTests"]

[[require]]
name = "veil"
git = "https://github.com/verse-lab/veil.git"
rev = "300c305e945750ab3fb62de4a79c23161b24da39"

[[lean_lib]]
name = "Umpire3"

[[lean_lib]]
name = "Umpire3Tests"

[[lean_lib]]
name = "Umpire3VeilTests"

[[lean_lib]]
name = "Temporal"

[[lean_exe]]
name = "umpire3_trace_replay"
root = "Umpire3.Command.Replay.Trace"

[[lean_exe]]
name = "umpire3_temporal_lasso_replay"
root = "Umpire3.Command.Replay.TemporalLasso"

[[lean_exe]]
name = "umpire3_native_certificate_check"
root = "Umpire3.Command.Check.NativeCertificate"

[[lean_exe]]
name = "umpire3_veil_sound"
root = "Umpire3.Command.Check.VeilSound"

[[lean_exe]]
name = "umpire3_veil_mutated"
root = "Umpire3.Command.Check.VeilMutated"

[[lean_exe]]
name = "umpire3_veil_sound_proof"
root = "Umpire3.Command.Check.VeilSoundProof"

[[lean_exe]]
name = "umpire3_veil_sound_trusted_proof"
root = "Umpire3.Command.Check.VeilSoundTrustedProof"
