- included_paths:
    - '**/*.proto'
  disabled_rules:
    - 'core::0192::has-comments'
    - 'core::0191::java-outer-classname'
    - 'core::0191::java-multiple-files'
    - 'core::0191::java-package'

- included_paths:
    - '**/message.proto'
    - '**/persistence/v1/*.proto'
  disabled_rules:
    - 'core::0122::name-suffix'
    - 'core::0123::resource-annotation'

- included_paths:
    - '**/*service/v1/request_response.proto'
  disabled_rules:
    - 'core::0122::name-suffix'
    - 'core::0131::request-name-required'
    - 'core::0131::request-unknown-fields'
    - 'core::0132::request-parent-required'
    - 'core::0132::request-unknown-fields'
    - 'core::0132::response-unknown-fields'
    - 'core::0134::request-unknown-fields'
    - 'core::0135::request-name-required'
    - 'core::0135::request-unknown-fields'
    - 'core::0158::response-next-page-token-field'
    - 'core::0158::response-plural-first-field'
    - 'core::0158::response-repeated-first-field'
    - 'core::0158::request-page-token-field'
    - 'core::0158::request-page-size-field'
    - 'core::0165::response-purge-sample-field'
    - 'core::0165::response-purge-count-field'
    - 'core::0165::request-filter-field'
    - 'core::0165::request-parent-field'
    - 'core::0165::request-force-field'

- included_paths:
    - '**/*service/v1/service.proto'
  disabled_rules:
    - 'core::0127::http-annotation'
    - 'core::0131::method-signature'
    - 'core::0131::response-message-name'
    - 'core::0135::method-signature'
    - 'core::0135::response-message-name'

# The Umpire IR is the syntax tree of a lifted Model, not a resource API: its fields are the words a
# Model declares (`from`, `to`, `with`, a type's name, a timeout in milliseconds), and renaming or
# retyping one would change the schema the checked-in IR is written in.
- included_paths:
    - '**/umpire/v1/ir.proto'
  disabled_rules:
    - 'core::0122::name-suffix'
    - 'core::0123::resource-annotation'
    - 'core::0140::prepositions'
    - 'core::0140::reserved-words'
    - 'core::0141::forbidden-types'
    - 'core::0142::time-field-type'

# A Case names a Model's class and its own local names by the glossary's terms, not resource names.
- included_paths:
    - '**/testpilot/v1/case.proto'
  disabled_rules:
    - 'core::0122::name-suffix'
