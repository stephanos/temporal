// The Umpire IR's expressions: pure functions and the expression trees that are their bodies. A
// file of the IR schema rooted at ir.proto.
syntax = "proto3";

package temporal.server.api.umpire.v1;

option go_package = "go.temporal.io/server/api/umpire/v1;umpire";
option java_multiple_files = true;
option java_package = "io.temporal.server.api.umpire.v1";

import "google/protobuf/empty.proto";
import "temporal/server/api/umpire/v1/common.proto";
import "temporal/server/api/umpire/v1/value.proto";

// A pure function: parameters, and a body that is an expression tree.
message Function {
  // Fully qualified, e.g. `temporal.nexuscaller.kernel.Protocol.handlerReplyStep`.
  string name = 1;
  Position position = 2;
  repeated Param params = 3;
  Expr body = 4;
  // A precondition the front end recorded. The interpreter evaluates only functions whose callers
  // satisfy it; the Stainless lemmas are what prove it holds.
  Expr requires = 5;
}

message Param {
  string name = 1;
  TypeRef type = 2;
}

// An expression. Every operator is total over the values the types admit.
message Expr {
  Position position = 1;
  oneof kind {
    Value literal = 2;
    // A parameter, or a name a `let` or a pattern bound.
    string var = 3;
    FieldAccess field = 4;
    Call call = 5;
    Construct construct = 6;
    Copy copy = 7;
    Unary unary = 8;
    Binary binary = 9;
    If if = 10;
    Match match = 11;
    Let let = 12;
    ListOf list = 13;
    Lambda lambda = 14;
    // A declared hole, by its id: the Model does not say what happens here.
    string hole = 15;
    Inbox inbox = 16;
  }
}

message FieldAccess {
  Expr base = 1;
  string field = 2;
}

message Call {
  // A Function of the Model.
  string function = 1;
  repeated Expr args = 2;
}

// A record, or an enum case with its fields, from arguments in field order.
message Construct {
  string type = 1;
  // The case, for an enum; empty for a record.
  string case = 2;
  repeated Expr args = 3;
  // For a step record (`umpire.Step`) only: the name of the alternative of a named choice this
  // result is. Evaluation ignores it (model/SEMANTICS.md, Named choices); empty for an unnamed step.
  string choice = 4;
}

// A record with some fields replaced.
message Copy {
  Expr base = 1;
  repeated NamedExpr updates = 2;
}

message NamedExpr {
  string name = 1;
  Expr value = 2;
}

message Unary {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_NOT = 1;
    OP_NEG = 2;
  }
  Op op = 1;
  Expr operand = 2;
}

message Binary {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_EQ = 1;
    OP_NE = 2;
    OP_AND = 3;
    OP_OR = 4;
    OP_LT = 5;
    OP_LE = 6;
    OP_GT = 7;
    OP_GE = 8;
    OP_ADD = 9;
    OP_SUB = 10;
    // List concatenation.
    OP_CONCAT = 11;
    // List membership: the right operand contains the left.
    OP_CONTAINS = 12;
  }
  Op op = 1;
  Expr left = 2;
  Expr right = 3;
}

message If {
  Expr condition = 1;
  Expr then = 2;
  Expr else = 3;
}

// The first case whose pattern matches the scrutinee, and whose guard holds, gives the value. A
// value no case matches is a hole in the Model, which the interpreter reports.
// That hole is an undeclared one (model/SEMANTICS.md, Holes), neither a declared hole nor an
// admission error.
message Match {
  Expr scrutinee = 1;
  repeated MatchCase cases = 2;
}

message MatchCase {
  Pattern pattern = 1;
  Expr guard = 2;
  Expr body = 3;
}

message Pattern {
  oneof kind {
    google.protobuf.Empty wildcard = 1;
    // Binds the value to a name, and matches it against the inner pattern.
    Bind bind = 2;
    // A value: an enum case without fields, a Boolean, an integer.
    Value literal = 3;
    // An enum case, and patterns for its fields.
    CasePattern case = 4;
    Alternatives alternatives = 5;
  }
}

message Bind {
  string name = 1;
  Pattern pattern = 2;
}

message CasePattern {
  string type = 1;
  string case = 2;
  repeated Pattern fields = 3;
}

message Alternatives {
  repeated Pattern patterns = 1;
}

message Let {
  string name = 1;
  Expr value = 2;
  Expr body = 3;
}

message ListOf {
  repeated Expr items = 1;
}

// An operation on what a channel holds.
message Inbox {
  enum Op {
    OP_UNSPECIFIED = 0;
    // The contents with the message added.
    OP_SEND = 1;
    OP_IS_EMPTY = 2;
    // Whether the contents hold as many messages as the channel's capacity.
    OP_IS_FULL = 3;
  }
  Op op = 1;
  // The channel's id.
  string channel = 2;
  Expr contents = 3;
  // The message, for OP_SEND.
  Expr message = 4;
}

// An anonymous function, for a machine's `ends` predicate.
message Lambda {
  repeated Param params = 1;
  Expr body = 2;
}
