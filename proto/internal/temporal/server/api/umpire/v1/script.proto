// A realization's scripts: how each is activated, the work it performs and the commands it sends.
// A file of the IR schema rooted at ir.proto.
syntax = "proto3";

package temporal.server.api.umpire.v1;

option go_package = "go.temporal.io/server/api/umpire/v1;umpire";
option java_multiple_files = true;
option java_package = "io.temporal.server.api.umpire.v1";

import "temporal/server/api/umpire/v1/common.proto";
import "temporal/server/api/umpire/v1/machine.proto";
import "temporal/server/api/umpire/v1/operand.proto";

// One ordered list of commands and who runs it: the controller, or a worker for each workflow,
// Nexus operation or activity it is activated by.
message Script {
  string id = 1;
  Position position = 2;
  oneof activation {
    Empty controller = 3;
    WorkflowActivation workflow = 4;
    NexusHandlerActivation nexus_handler = 5;
    ActivityActivation activity = 6;
  }
  repeated Item items = 7;
}

message WorkflowActivation {
  Name workflow_type = 1;
  // Roles, by id.
  string worker = 2;
  string task_queue = 3;
}

message NexusHandlerActivation {
  string service = 1;
  string operation = 2;
  string worker = 3;
  string task_queue = 4;
}

message ActivityActivation {
  Name activity_type = 1;
  string worker = 2;
  string task_queue = 3;
  // The classes an attempt's delivery to the worker is: a step of one of them is each activation of
  // the script, and no command performs it.
  repeated ActionClass starts = 4;
}

// One item of a script: a command every Case carries, a command only the Cases whose path performs
// one of the `when` classes carry, or the place the path's steps of the classes `performs` binds
// land, in path order, each as the command bound to its class.
message Item {
  Position position = 1;
  Command command = 2;
  repeated ActionClass when = 3;
  repeated Performance performs = 4;
}

// The command that performs one class of an action.
message Performance {
  Position position = 1;
  ActionClass step = 2;
  Command command = 3;
}

// One command of a script: what it does, the commands it runs after, and its bounds.
message Command {
  string id = 1;
  Position position = 2;
  // The commands of its script it runs after. Unset, it runs after the command before it.
  After after = 3;
  // Its deadline in milliseconds, or 0 for the run's default.
  int64 timeout_ms = 4;
  // Whether it runs whatever became of the commands it runs after.
  bool regardless = 5;
  oneof instruction {
    Rpc rpc = 6;
    Poll poll = 7;
    // Waits until a learned value, by id, is bound.
    string await_learned = 8;
    // Waits for the operation an earlier command of its script, by id, started.
    string await_command = 9;
    Finish finish = 10;
    Fault fault = 11;
    WorkflowCommand workflow_command = 12;
    NexusReply nexus_reply = 13;
    NexusCompletion nexus_completion = 14;
    // Starts holding what a control, by id, holds; and lets it go.
    string hold = 15;
    string release = 16;
    AttemptFailure attempt_failure = 17;
    // Answers the attempt an activity script's command runs in as canceled.
    Empty attempt_canceled = 19;
    // Withholds an activity attempt's answer until its armed server deadline ends it.
    // Used only in an activity script's on-path item naming one bounded timer, never a performance.
    AttemptWithheld attempt_withheld = 20;
    AttemptHeartbeat attempt_heartbeat = 21;
    string await_activity_publication = 22;
  }
  // The exhaustive kinds of evidence, by id, this command's read is the closing read of: the read
  // after which their sources report nothing more.
  repeated string closes = 18;
}

message AttemptHeartbeat { Proto details = 1; }

message AttemptWithheld {
  WithholdingMode mode = 1;
  // The controller's typed answer named by the external-settlement declaration.
  string external_settlement = 2;
}

enum WithholdingMode {
  WITHHOLDING_MODE_CONTEXT = 0;
  WITHHOLDING_MODE_SDK_PENDING = 1;
}

message After {
  repeated string commands = 1;
}

// A unary call on an endpoint role: the request its assignments build, and what it reads out of the
// response.
message Rpc {
  string role = 1;
  // The full method name, "/package.Service/Method".
  string method = 2;
  repeated Assignment assign = 3;
  repeated ResponseRead reads = 4;
}

message Assignment {
  // A field path of the request.
  string target = 1;
  Operand value = 2;
}

message ResponseRead {
  // A field path of the response.
  string path = 1;
  enum Cardinality {
    CARDINALITY_UNSPECIFIED = 0;
    CARDINALITY_ONE = 1;
    // One value per element of a repeated path.
    CARDINALITY_EACH = 2;
  }
  Cardinality cardinality = 2;
  repeated Target targets = 3;
}

// Where a read value goes.
message Target {
  oneof target {
    // An observation, by id.
    string observe = 1;
    // A learned value, by id, which this read binds.
    string bind = 2;
    // The evidence kinds a history read confirms, lifted into the observation of this id.
    string lift = 3;
  }
}

// Polls the read an evidence kind names until an element satisfies `until`.
message Poll {
  // An Evidence, by id.
  string evidence = 1;
  string role = 2;
  repeated Assignment assign = 3;
  Operand until = 4;
  int64 interval_ms = 5;
}

// Completes with a result: the workflow a workflow script runs in, or the attempt a command of an
// activity script runs in.
message Finish {
  Operand result = 1;
}

// Fails the attempt an activity script's command runs in, with a temporal.api.failure.v1.Failure.
message AttemptFailure {
  Proto failure = 1;
}

// A deliberate outage of the worker that polls a task-queue role.
message Fault {
  string role = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_WORKER_STOP = 1;
    KIND_WORKER_RESUME = 2;
    KIND_ADMISSION_RESPONSE_LOSS = 3;
  }
  Kind kind = 2;
}

// A workflow command, as the message the SDK would emit.
message WorkflowCommand {
  Proto command = 1;
}

// A Nexus handler's answer: a start response or a handler error.
message NexusReply {
  Proto reply = 1;
  // The handle, a learned value by id, an asynchronous answer binds; or empty.
  string binds = 2;
}

// Completes the asynchronous Nexus operation a handle names, with a payload or a failure.
message NexusCompletion {
  // A learned value, by id.
  string handle = 1;
  Proto result = 2;
}
