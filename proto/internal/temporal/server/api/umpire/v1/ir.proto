// The Umpire model IR: a semantic transition system, independent of the language a Model is authored
// in. A front end (model/irgen lifts Scala) emits it; the Go reader in tools/umpire/model
// validates it, interprets it, and derives every table, identity and fingerprint from it. Like the
// Testpilot protocol, it is an internal wire with no compatibility promise. The
// evaluation rules are written in model/SEMANTICS.md; neither front end nor interpreter
// defines them.
//
// The IR carries declarations, never derived tables: steps are pure functions over values, and the
// tables are what the interpreter computes from them.
syntax = "proto3";

package temporal.server.api.umpire.v1;

option go_package = "go.temporal.io/server/api/umpire/v1;umpire";
option java_multiple_files = true;
option java_package = "io.temporal.server.api.umpire.v1";

import "google/protobuf/wrappers.proto";

// A Model: its types, its pure functions, its actions, and its machines.
// It also carries the declarations checks read over them.
message Model {
  // Where the Model was lifted from, for diagnostics and provenance.
  string source = 1;
  repeated Type types = 2;
  repeated Function functions = 3;
  repeated Action actions = 4;
  repeated Machine machines = 5;
  // The IR's major version. model/SEMANTICS.md defines version 0, which every Model written
  // before this field was is in; a reader rejects a version it does not know.
  uint32 version = 6;
  repeated Channel channels = 7;
  repeated Monitor monitors = 8;
  repeated Assumption assumptions = 9;
  repeated Hole holes = 10;
  repeated Composition compositions = 11;
  repeated Property properties = 12;
  repeated Scenario scenarios = 13;
  repeated Query queries = 14;
  repeated Progress progress = 15;
  repeated Realization realizations = 16;
}

// Where a declaration or expression was written, as a front end reports it.
message Position {
  string file = 1;
  int32 line = 2;
}

// A finite type, with its members in catalog order.
message Type {
  // Fully qualified, e.g. `temporal.nexuscaller.kernel.ProtocolState`.
  string name = 1;
  Position position = 2;
  oneof shape {
    // A sum of cases, each with its own finite fields; a case without fields is one member.
    Enum enum = 3;
    // A product of finite fields, the last field varying fastest.
    Record record = 4;
  }
}

message Enum {
  repeated Case cases = 1;
}

message Case {
  string name = 1;
  repeated Field fields = 2;
}

message Record {
  repeated Field fields = 1;
}

message Field {
  string name = 1;
  TypeRef type = 2;
}

// A reference to a finite type: a declared type, the Booleans, or an integer range.
message TypeRef {
  oneof ref {
    string named = 1;
    Empty bool = 2;
    IntRange int_range = 3;
    // A list of values, for a step's facts and a function's results; not a state field.
    TypeRef list = 4;
    // An integer with no declared range: a function parameter, never a state field.
    Empty int = 5;
    // What a declared channel holds, named by the channel's id: a state field's bounded collection.
    string channel = 6;
  }
}

message IntRange {
  int64 low = 1;
  int64 high = 2;
}

message Empty {}

// A pure function: parameters, and a body that is an expression tree.
message Function {
  // Fully qualified, e.g. `temporal.nexuscaller.kernel.Protocol.handlerReplyStep`.
  string name = 1;
  Position position = 2;
  repeated Param params = 3;
  Expr body = 4;
  // A precondition the front end recorded. The interpreter evaluates only functions whose callers
  // satisfy it; the Stainless lemmas are what prove it holds.
  Expr requires = 5;
}

message Param {
  string name = 1;
  TypeRef type = 2;
}

// An expression. Every operator is total over the values the types admit.
message Expr {
  Position position = 1;
  oneof kind {
    Value literal = 2;
    // A parameter, or a name a `let` or a pattern bound.
    string var = 3;
    FieldAccess field = 4;
    Call call = 5;
    Construct construct = 6;
    Copy copy = 7;
    Unary unary = 8;
    Binary binary = 9;
    If if = 10;
    Match match = 11;
    Let let = 12;
    ListOf list = 13;
    Lambda lambda = 14;
    // A declared hole, by its id: the Model does not say what happens here.
    string hole = 15;
    Inbox inbox = 16;
  }
}

message FieldAccess {
  Expr base = 1;
  string field = 2;
}

message Call {
  // A Function of the Model.
  string function = 1;
  repeated Expr args = 2;
}

// A record, or an enum case with its fields, from arguments in field order.
message Construct {
  string type = 1;
  // The case, for an enum; empty for a record.
  string case = 2;
  repeated Expr args = 3;
  // For a step record (`umpire.Step`) only: the name of the alternative of a named choice this
  // result is. Evaluation ignores it (model/SEMANTICS.md, Named choices); empty for an unnamed step.
  string choice = 4;
}

// A record with some fields replaced.
message Copy {
  Expr base = 1;
  repeated NamedExpr updates = 2;
}

message NamedExpr {
  string name = 1;
  Expr value = 2;
}

message Unary {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_NOT = 1;
    OP_NEG = 2;
  }
  Op op = 1;
  Expr operand = 2;
}

message Binary {
  enum Op {
    OP_UNSPECIFIED = 0;
    OP_EQ = 1;
    OP_NE = 2;
    OP_AND = 3;
    OP_OR = 4;
    OP_LT = 5;
    OP_LE = 6;
    OP_GT = 7;
    OP_GE = 8;
    OP_ADD = 9;
    OP_SUB = 10;
    // List concatenation.
    OP_CONCAT = 11;
    // List membership: the right operand contains the left.
    OP_CONTAINS = 12;
  }
  Op op = 1;
  Expr left = 2;
  Expr right = 3;
}

message If {
  Expr condition = 1;
  Expr then = 2;
  Expr else = 3;
}

// The first case whose pattern matches the scrutinee, and whose guard holds, gives the value. A
// value no case matches is a hole in the Model, which the interpreter reports.
// That hole is an undeclared one (model/SEMANTICS.md, Holes), neither a declared hole nor an
// admission error.
message Match {
  Expr scrutinee = 1;
  repeated MatchCase cases = 2;
}

message MatchCase {
  Pattern pattern = 1;
  Expr guard = 2;
  Expr body = 3;
}

message Pattern {
  oneof kind {
    Empty wildcard = 1;
    // Binds the value to a name, and matches it against the inner pattern.
    Bind bind = 2;
    // A value: an enum case without fields, a Boolean, an integer.
    Value literal = 3;
    // An enum case, and patterns for its fields.
    CasePattern case = 4;
    Alternatives alternatives = 5;
  }
}

message Bind {
  string name = 1;
  Pattern pattern = 2;
}

message CasePattern {
  string type = 1;
  string case = 2;
  repeated Pattern fields = 3;
}

message Alternatives {
  repeated Pattern patterns = 1;
}

message Let {
  string name = 1;
  Expr value = 2;
  Expr body = 3;
}

message ListOf {
  repeated Expr items = 1;
}

// An operation on what a channel holds.
message Inbox {
  enum Op {
    OP_UNSPECIFIED = 0;
    // The contents with the message added.
    OP_SEND = 1;
    OP_IS_EMPTY = 2;
    // Whether the contents hold as many messages as the channel's capacity.
    OP_IS_FULL = 3;
  }
  Op op = 1;
  // The channel's id.
  string channel = 2;
  Expr contents = 3;
  // The message, for OP_SEND.
  Expr message = 4;
}

// An anonymous function, for a machine's `ends` predicate.
message Lambda {
  repeated Param params = 1;
  Expr body = 2;
}

// A value of a finite type.
message Value {
  oneof kind {
    bool bool = 1;
    int64 int = 2;
    EnumValue enum = 3;
    RecordValue record = 4;
    ListValue list = 5;
    string text = 6;
  }
}

message EnumValue {
  string type = 1;
  string case = 2;
  repeated Value fields = 3;
}

message RecordValue {
  string type = 1;
  repeated Value fields = 2;
}

message ListValue {
  repeated Value items = 1;
}

// An action: a party's side effect or a timer the system owns, with its finite inputs.
// The system owns its other steps too: an internal step, and a channel's delivery or loss.
message Action {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  // The name its classes are keyed by.
  string name = 2;
  Position position = 3;
  string party = 4;
  bool timer = 5;
  repeated Param inputs = 6;
  string on = 7;
  string creates = 8;
  repeated string schemas = 9;
  string results = 10;
  repeated Example examples = 11;
  // A step of the system that is not a timer.
  bool internal = 12;
  // A channel's delivery of one message, its one input, by the channel's id.
  string delivers = 13;
  // A lossy channel's loss of one message, its one input, by the channel's id.
  string loses = 14;
}

// An Abstraction Claim on one class of a one-input action.
message Example {
  Value value = 1;
  string example = 2;
}

// A machine: a state type, the step function bound to each action, the states it starts in, the
// states it may end in, the evidence for each fact, and the machine it refines.
// It also names the monitors that watch it and the assumptions checking it makes.
message Machine {
  string family = 1;
  string name = 2;
  Position position = 3;
  string entity = 4;
  string state_type = 5;
  string outcome_type = 6;
  // Empty when the machine records no facts.
  string fact_type = 7;
  repeated Expr starts = 8;
  // A predicate over the state.
  Expr ends = 9;
  repeated StepBinding steps = 10;
  // A function from a fact to the recorded event or observation that confirms it.
  string evidence = 11;
  repeated string unobservable = 12;
  Refinement refines = 13;
  // Monitors, by id.
  repeated string monitors = 14;
  // Assumptions every result of a check of this machine names, by id: that it stands for an opaque
  // provider, or that it includes a fault only an assumption allows.
  repeated string assumes = 15;
}

message StepBinding {
  // An Action's id.
  string action = 1;
  // A Function taking the state, then one argument per input, returning a list of the framework's
  // step records `{outcome, state, facts, because}`.
  string function = 2;
  Position position = 3;
}

message Refinement {
  // The refined machine's name.
  string product = 1;
  // A Function from this machine's state to the refined machine's.
  string map = 2;
  // A Function from a fact of this machine to whether the refined machine sees it. Empty when the
  // refinement declares no projection.
  string visible = 3;
  // A Function from an outcome of this machine to whether the refined machine sees it. Empty when the
  // refinement names no outcome the refined machine sees.
  string visible_outcomes = 4;
}

// A bounded channel: the messages one machine's state holds between their send and their delivery.
message Channel {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  string name = 2;
  Position position = 3;
  TypeRef message = 4;
  // The most messages it holds at once, at least 1.
  int32 capacity = 5;
  enum Order {
    ORDER_UNSPECIFIED = 0;
    // In the order they were sent.
    ORDER_FIFO = 1;
    // Any held message may be delivered next.
    ORDER_UNORDERED = 2;
  }
  Order order = 6;
  // Whether it may lose a message it holds.
  bool lossy = 7;
  // How many more times than once it may deliver a message, because the acknowledgment of a
  // delivery was lost.
  int32 duplicates = 8;
}

// A passive monitor: a finite state that every step of the machines it watches advances, and a
// verdict read at its evaluation point. It reads steps and never disables one.
message Monitor {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  string name = 2;
  Position position = 3;
  TypeRef state = 4;
  Expr initial = 5;
  // A Function taking the monitor's state, the machine's state before a step and the step record,
  // returning the monitor's state after the step.
  string next = 6;
  // A Function from the monitor's state to whether the monitor is violated.
  string violated = 7;
  // Where the verdict is read.
  oneof evaluate {
    // After every step.
    Empty every_step = 8;
    // At the end of a path, in a state the machine may end in.
    Empty at_ends = 9;
    // After the steps a Function from the step record to a Boolean accepts.
    string after = 10;
  }
}

// A named assumption a check makes and every result it reports names.
message Assumption {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  string name = 2;
  Position position = 3;
  // Actions, by id, that the assumption makes weakly fair: one that stays enabled is taken.
  repeated string fair = 4;
}

// A declared hole: behavior the Model leaves unknown on purpose, which makes a result that reaches it
// incomplete.
message Hole {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  string name = 2;
  Position position = 3;
}

// A composition: one Model from machines of different entities, a state with one field per member.
message Composition {
  string family = 1;
  string name = 2;
  Position position = 3;
  string state_type = 4;
  repeated Member members = 5;
  repeated Sync syncs = 6;
  // A predicate over the composed state.
  Expr ends = 7;
}

message Member {
  // The composed state's field the member fills.
  string field = 1;
  // A machine's name.
  string machine = 2;
  // The name of the machine this member stands in for, which it must refine: a detailed provider
  // replacing an opaque one within this composition. Empty when it replaces none.
  string replaces = 3;
}

// Two members' actions paired into one step.
message Sync {
  string name = 1;
  SyncMove first = 2;
  SyncMove second = 3;
}

message SyncMove {
  // The member's field.
  string member = 1;
  // The action's name.
  string action = 2;
}

// One class of an action: the action, by id, and one value per input.
message ActionClass {
  string action = 1;
  repeated Value inputs = 2;
}

// A Property: a pass/fail rule over the steps of the machine or composition it is declared on.
message Property {
  // The machine's or composition's name.
  string machine = 1;
  string name = 2;
  Position position = 3;
  // The steps it is about; every step when neither is set.
  oneof when {
    ActionClass when_class = 4;
    // Every class of the action of this name.
    string when_action = 5;
  }
  // A Function from the step record to a Boolean, or with `transition` from the state before the
  // step and the step record.
  string holds = 6;
  bool transition = 7;
}

// A Scenario: a named schedule from one start.
message Scenario {
  // The machine's or composition's name.
  string machine = 1;
  string name = 2;
  Position position = 3;
  Expr start = 4;
  // The pinned schedule, one class per step.
  repeated ActionClass actions = 5;
  // A composition's pinned schedule, by its composed class keys.
  repeated string keys = 6;
  // Any action at every step, within the Query's step limit.
  bool free = 7;
}

// A Property or Scenario, by the machine it is declared on and its name.
message ClaimRef {
  string machine = 1;
  string name = 2;
}

// A bounded question: a Property, a Scenario and Limits.
message Query {
  string name = 1;
  Position position = 2;
  enum Form {
    FORM_UNSPECIFIED = 0;
    // One trace of the Scenario on which the Property holds.
    FORM_FIND = 1;
    // Whether the Property holds on every trace of the Scenario.
    FORM_VERIFY = 2;
  }
  Form form = 3;
  ClaimRef property = 4;
  ClaimRef scenario = 5;
  // The Scenario's machine reads the Property through the refinement it declares.
  bool through = 6;
  Limits limits = 7;
  RunExpectation expected_run = 8;
  Exploration exploration = 9;
  // The author's count of the Query's static combinations: the Scenario machine's states times the
  // scheduled slots within the step limit when pinned, or times its action classes times the step
  // limit when free (model/SEMANTICS.md, Query totals). The reader recomputes and checks it; nothing
  // else reads it, so no fingerprint, answer, lowering or exploration identity changes with it. Unset
  // only in IR lifted before it existed. A wrapper, not proto3 `optional`, which the pinned
  // protoc-gen-go-helpers refuses; both are written `"total": "48"` in ProtoJSON.
  google.protobuf.Int64Value total = 10;
}

// Finite input domains over a Query's pinned prefix. Choices replace the indexed action;
// the final action is retained. Higher total priority is tried first, ties by choice names.
message Exploration {
  string name = 1;
  Position position = 2;
  repeated Variation variations = 3;
  int32 runs = 4;
  int32 edits = 5;
  bool drop_prefix = 6;
}
message Variation {
  int32 index = 1;
  repeated Alternative choices = 2;
  Position position = 3;
}
message Alternative {
  string name = 1;
  int32 priority = 2;
  repeated ActionClass actions = 3;
  Position position = 4;
}

// Expected assessment of a completed live Run, separate from the Query's model-search answer.
message RunExpectation {
  enum Conformance {
    CONFORMANCE_UNSPECIFIED = 0;
    CONFORMANCE_CONFORMANT = 1;
    CONFORMANCE_NONCONFORMANT = 2;
    CONFORMANCE_INCONCLUSIVE = 3;
  }
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SATISFIED = 1;
    OUTCOME_VIOLATED = 2;
    OUTCOME_INCONCLUSIVE = 3;
  }
  // How the Run ends, as Testpilot's RunDisposition names it.
  enum Disposition {
    DISPOSITION_UNSPECIFIED = 0;
    DISPOSITION_COMPLETED = 1;
    DISPOSITION_STOPPED_BY_MONITOR = 2;
    DISPOSITION_INCOMPLETE = 3;
  }
  // How the Run's cleanup ends, as Testpilot's CleanupStatus names it.
  enum Cleanup {
    CLEANUP_UNSPECIFIED = 0;
    CLEANUP_SUCCEEDED = 1;
    CLEANUP_FAILED = 2;
    CLEANUP_TIMED_OUT = 3;
  }
  // Why the model assessment leaves an outcome short of satisfied: the judge's own reasons, by id.
  // The assessment reports the id beside its prose (tools/umpire/conformance/conclude.go).
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The Run recorded no evidence of the machine.
    REASON_NO_EVIDENCE = 1;
    // The Run did not close complete.
    REASON_INCOMPLETE = 2;
    // A hole of the Model is in reach.
    REASON_HOLE = 3;
    // No modeled execution explains the evidence.
    REASON_UNEXPLAINED = 4;
    // The explaining executions disagree on the claim.
    REASON_EXPLANATIONS_DISAGREE = 5;
    // An explaining execution never reaches the claim's evaluation point.
    REASON_NEVER_EVALUATED = 6;
    // The claim cannot be read on an explaining execution.
    REASON_UNREADABLE = 7;
    // Every explaining execution violates the claim.
    REASON_EVERY_EXPLANATION_VIOLATES = 8;
  }
  reserved 2;
  // The selected Property's outcome, and its reason when it is not satisfied.
  Outcome property = 1;
  Reason reason = 8;
  Conformance conformance = 3;
  repeated MonitorExpectation monitors = 4;
  // The Contract's Verdict.
  Outcome contract = 5;
  Disposition disposition = 6;
  Cleanup cleanup = 7;
}

message MonitorExpectation {
  reserved 3;
  string name = 1;
  RunExpectation.Outcome outcome = 2;
  // Set exactly when the outcome is not satisfied.
  RunExpectation.Reason reason = 4;
}

message Limits {
  string name = 1;
  // The depth bound.
  int32 steps = 2;
  // The schedule length.
  int32 actions = 3;
  // The product states the search may visit.
  int32 search = 4;
}

// A bounded progress claim: from a state `from` accepts, a state `to` accepts follows within
// `within` steps, under the named assumptions.
message Progress {
  // The machine's name.
  string machine = 1;
  string name = 2;
  Position position = 3;
  // Functions from the state to a Boolean.
  string from = 4;
  string to = 5;
  int32 within = 6;
  // Assumptions, by id.
  repeated string assumptions = 7;
}

// A realization: how the find Queries of one machine run against a system. It declares the roles a
// run addresses, the values a run learns, what it observes and reads as evidence, the controls it
// needs, and the scripts its controller and its workers follow. It carries no Case: a reader lowers
// one Query's witness through it (model/SEMANTICS.md, Realizations).
message Realization {
  // The key the IR names it by: the front end's qualified name.
  string id = 1;
  string name = 2;
  Position position = 3;
  // The machine whose find Queries it realizes, by name.
  string machine = 4;
  // Who lowers it, as a Case's provenance names its producer.
  string producer = 5;
  string producer_version = 6;
  repeated Role roles = 7;
  repeated Learned learned = 8;
  repeated Observed observations = 9;
  repeated Evidence evidence = 10;
  Correlation correlation = 11;
  repeated Control controls = 12;
  repeated Script scripts = 13;
  // The id a run's coordinates give the cleanup it always attempts.
  string cleanup = 14;
  // The dynamic-configuration settings the realized system must run under. A Case lowered through
  // the realization carries them, and preparation refuses an environment that sets one otherwise.
  repeated RequiredSetting required_settings = 15;
  // How the APIs a run calls behave between its calls, as the system's kit declares it once: when a
  // write's effect is visible to a read, how long each kind of asynchronous cause may take, how
  // attempts are numbered, the limits of an instruction no hint bounds, and whether a run's record
  // order is causal. It shapes only a lowered Case's Program and how conformance reads a Run's
  // attempts; no table, ID, fingerprint, Query answer or Contract reads it. Unset in a realization no
  // kit declares behavior for.
  ApiBehavior behavior = 16;
  // The kind of cause each step class no command performs is, such as an activity's delivery or a
  // server timer at a deadline the realization set.
  repeated ServerStep server_steps = 17;
}

// A dynamic-configuration setting a realization requires: its key and its value, each spelled as
// the server's dynamic configuration spells it.
message RequiredSetting {
  string key = 1;
  string value = 2;
}

// How the APIs a realization calls behave between calls (.plans/API_BEHAVIOR_HINTS.md). Each
// declaration carries an id, which a lowered wait names the hint by, and the position it is
// declared at, which a wait that runs out reports.
message ApiBehavior {
  repeated Visibility visibility = 1;
  repeated CauseBound causes = 2;
  // How the system numbers an activity's attempts.
  AttemptNumbering attempt_numbering = 3;
  // The limits of an instruction no hint bounds and that writes none: a call whose response no read
  // waits on, a Driver wait or a control.
  InstructionLimit instruction_defaults = 4;
  // Whether a run's record order is the causal order of one operation's evidence across sources.
  bool run_order_is_causal = 5;
}

// How a system numbers the attempts of one activity: the Nth delivery is the attempt numbered
// first + N - 1, and with one_run every attempt belongs to the activity's one run.
message AttemptNumbering {
  Position position = 1;
  int64 first = 2;
  bool one_run = 3;
}

// The limits of one instruction: its deadline in milliseconds, and the attempts it may take.
message InstructionLimit {
  Position position = 1;
  int64 timeout_ms = 2;
  int64 attempts = 3;
}

// When the effect of a write is visible to a read: at once, or eventually within a bound.
message Visibility {
  // Stable and derived from the pair, e.g. "visibility.pauseActivityExecution.describeActivityExecution".
  string id = 1;
  Position position = 2;
  oneof write {
    // A method, "/package.Service/Method", that the API binds to HTTP POST.
    string method = 3;
    // A performed command that is no call, by the kind of cause it is.
    CauseKind cause = 4;
  }
  // The reading method, "/package.Service/Method", that the API binds to HTTP GET.
  string read = 5;
  // Unset: visible at once, so a read after the write reads once. Set: visible eventually, within
  // this bound.
  WaitBound eventually_within = 6;
}

// How long a condition may take to hold, and how often a wait looks, in milliseconds; both positive,
// and the interval no greater than the bound.
message WaitBound {
  Position position = 1;
  int64 interval_ms = 2;
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: The name is the bound's own "at most"; the IR is internal to Umpire. --)
  int64 at_most_ms = 3;
}

// How long one kind of asynchronous cause may take, once, from the step before it.
message CauseBound {
  // Stable and derived from the kind, e.g. "cause.delivery".
  string id = 1;
  Position position = 2;
  CauseKind kind = 3;
  WaitBound bound = 4;
}

// A kind of asynchronous cause a read can wait for: something no command of the read's own script
// does.
enum CauseKind {
  CAUSE_KIND_UNSPECIFIED = 0;
  // An activity script's answer: RespondActivityTaskCompleted, Failed or Canceled.
  CAUSE_KIND_ACTIVITY_ANSWER = 1;
  // A workflow script's commands: RespondWorkflowTaskCompleted.
  CAUSE_KIND_WORKFLOW_TASK = 2;
  // A Nexus handler script's reply: RespondNexusTaskCompleted or Failed.
  CAUSE_KIND_HANDLER_REPLY = 3;
  // The server's dispatch of a task to a worker.
  CAUSE_KIND_DELIVERY = 4;
  // A server timer at a deadline the realization set.
  CAUSE_KIND_TIMER = 5;
}

// A step class no command performs, and the kind of cause it is.
message ServerStep {
  Position position = 1;
  ActionClass step = 2;
  CauseKind kind = 3;
  // For a timer: the deadline the realization set for this class, written from the same kit value
  // its request carries. A wait for it is this deadline plus the timer's CauseBound, the slack.
  int64 deadline_ms = 4;
}

// A symbolic participant commands and activations address. Its bindings name the environment
// resources a run supplies.
message Role {
  string id = 1;
  Position position = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ENDPOINT = 1;
    KIND_WORKER = 2;
    KIND_TASK_QUEUE = 3;
    KIND_PARTICIPANT = 4;
  }
  Kind kind = 3;
  // The environment binding of a worker's or a task queue's namespace, or empty.
  string namespace = 4;
  // The environment binding of the role's resource, or empty.
  string resource = 5;
}

// A value a run learns: bound once, by one command, and read by the commands that depend on it.
message Learned {
  string id = 1;
  Position position = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TEXT = 1;
    // An effect handle the system issues, which only a command that completes the effect reads.
    KIND_HANDLE = 2;
  }
  Kind kind = 3;
}

// A typed value a run records for its checks: one protobuf message.
message Observed {
  string id = 1;
  Position position = 2;
  // The message's fully qualified protobuf name.
  string message = 3;
}

// One kind of evidence: the recorded data that confirms the facts a machine's evidence function
// names `records`, the field that keys it to its operation, what it commits to, the fields it keeps
// of the recorded data, and whether its source reports every occurrence.
message Evidence {
  string id = 1;
  Position position = 2;
  // The name the machine's evidence function gives the facts this kind confirms.
  string records = 3;
  // The evidence source identity this kind's evidence is counted in.
  string source = 4;
  oneof from {
    // The attributes member of temporal.api.history.v1.HistoryEvent a history read lifts.
    string history = 5;
    ReadSource read = 6;
    // The one message at `path` in the response of a unary method.
    ReadSource single = 11;
    // The Run's own record of one command's events.
    RunEventSource run_event = 12;
  }
  // The field path, in the recorded message, of the key that names the operation. A Run Event's
  // evidence leaves it empty: its source's key names the operation.
  string operation = 7;
  enum Commitment {
    COMMITMENT_UNSPECIFIED = 0;
    // What a caller was told: a response or a recorded event it can read back.
    COMMITMENT_REPORTED = 1;
    // A durable commit of the receiver, which no response implies.
    COMMITMENT_DURABLE = 2;
  }
  Commitment commitment = 8;
  // The fields of the recorded data the evidence carries.
  repeated EvidenceField fields = 9;
  // Whether the source reports every occurrence of the facts this kind records, for the operations
  // its closing read covers. A command of the realization names the kind in `closes`.
  bool exhaustive = 10;
  // The steps of a path one piece of this evidence confirms, where the fact it records is recorded
  // by more steps than one and each has evidence of its own. A kind that names steps confirms those
  // and no other, all of them or none. Empty, the kind confirms the one step of a path that records
  // its fact.
  repeated Taking confirms = 13;
}

// One step of a path: the `occurrence`-th step, counted from one, of a class.
message Taking {
  Position position = 1;
  ActionClass step = 2;
  int64 occurrence = 3;
}

// One field evidence carries: where it is read in the recorded data, and the identity it names.
message EvidenceField {
  string id = 1;
  Position position = 2;
  // The field path, in the recorded message.
  string path = 3;
  enum Role {
    // Data that names no identity.
    ROLE_UNSPECIFIED = 0;
    // The logical operation, as the kind's operation key names it.
    ROLE_OPERATION = 1;
    // The execution attempt the fact belongs to.
    ROLE_ATTEMPT = 2;
    // The delivery the fact belongs to.
    ROLE_DELIVERY = 3;
  }
  Role role = 4;
  // Whether the evidence carries the field without its value.
  bool redacted = 5;
}

// The Run Events of one kind that one command of a script records, where `guard` holds of the event's
// payload, the instruction outcome: each is one occurrence of the evidence, of the operation `key`
// names.
message RunEventSource {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The command's own completion.
    KIND_INSTRUCTION_COMPLETED = 1;
    KIND_INSTRUCTION_TIMED_OUT = 2;
    // What a worker reports of an activation the command carries, such as one attempt of an activity.
    KIND_DIAGNOSTIC = 3;
  }
  Kind kind = 1;
  // The script, by id, and its command, by id.
  string script = 2;
  string command = 3;
  // The operation's key: the run's own id, or a path of the payload.
  Operand key = 4;
  // A condition over the payload, the value `projected` names. Unset, every such event is evidence.
  Operand guard = 5;
  // Set where the events are the Run's record of one attempt of an activity: the attempt, and the
  // activity script it is an attempt of. A Run records an attempt once it is answered, so such
  // evidence reaches the Run with that answer, and not with the command that carries it. A
  // KIND_DIAGNOSTIC source always sets it, and no other kind does.
  AttemptOf attempt = 6;
}

// One attempt of the activity one script runs: the `number`-th delivery to the script's worker,
// counted from one, as the server numbers attempts.
message AttemptOf {
  Position position = 1;
  // The activity's script, by id.
  string script = 2;
  int64 number = 3;
}

// The field at `path` in the response of a unary method: the elements of a repeated field, or one
// message.
message ReadSource {
  // The full method name, "/package.Service/Method".
  string method = 1;
  string path = 2;
}

// How a run's evidence is keyed into operations, and the window a check of it keeps.
message Correlation {
  Position position = 1;
  // The Definition ID of the projection.
  string projection = 2;
  // The field that scopes every evidence identity to its run.
  string run = 3;
  // The field that names the operation.
  string operation = 4;
  // The observation, of the correlated evidence message, that carries lifted evidence.
  string observation = 5;
  int64 events = 6;
  int64 buffered = 7;
  int64 keys = 8;
  int64 support = 9;
  int64 work = 10;
  int64 event_size = 11;
}

// An actuator a run needs beyond its commands: a reader that cannot supply it refuses the
// realization rather than run without it.
message Control {
  string id = 1;
  Position position = 2;
  oneof kind {
    // Holds the deliveries of a channel, by the channel's id, until a command releases them.
    string hold_delivery = 3;
    HoldDispatched hold_dispatched = 5;
  }
  // The task-queue role whose deliveries a run holds, by id.
  string role = 4;
}

// Holds what a step of the class dispatches, until a command releases it.
message HoldDispatched {
  ActionClass step = 1;
}

// One ordered list of commands and who runs it: the controller, or a worker for each workflow,
// Nexus operation or activity it is activated by.
message Script {
  string id = 1;
  Position position = 2;
  oneof activation {
    Empty controller = 3;
    WorkflowActivation workflow = 4;
    NexusHandlerActivation nexus_handler = 5;
    ActivityActivation activity = 6;
  }
  repeated Item items = 7;
}

message WorkflowActivation {
  Name workflow_type = 1;
  // Roles, by id.
  string worker = 2;
  string task_queue = 3;
}

message NexusHandlerActivation {
  string service = 1;
  string operation = 2;
  string worker = 3;
  string task_queue = 4;
}

message ActivityActivation {
  Name activity_type = 1;
  string worker = 2;
  string task_queue = 3;
  // The classes an attempt's delivery to the worker is: a step of one of them is each activation of
  // the script, and no command performs it.
  repeated ActionClass starts = 4;
}

// A text a Case gets its own copy of: the prefix, then the Case's fixture name when `fixture` is
// set, then the suffix.
message Name {
  string prefix = 1;
  bool fixture = 2;
  string suffix = 3;
}

// One item of a script: a command every Case carries, a command only the Cases whose path performs
// one of the `when` classes carry, or the place the path's steps of the classes `performs` binds
// land, in path order, each as the command bound to its class.
message Item {
  Position position = 1;
  Command command = 2;
  repeated ActionClass when = 3;
  repeated Performance performs = 4;
}

// The command that performs one class of an action.
message Performance {
  Position position = 1;
  ActionClass step = 2;
  Command command = 3;
}

// One command of a script: what it does, the commands it runs after, and its bounds.
message Command {
  string id = 1;
  Position position = 2;
  // The commands of its script it runs after. Unset, it runs after the command before it.
  After after = 3;
  // Its deadline in milliseconds, or 0 for the run's default.
  int64 timeout_ms = 4;
  // Whether it runs whatever became of the commands it runs after.
  bool regardless = 5;
  oneof instruction {
    Rpc rpc = 6;
    Poll poll = 7;
    // Waits until a learned value, by id, is bound.
    string await_learned = 8;
    // Waits for the operation an earlier command of its script, by id, started.
    string await_command = 9;
    Finish finish = 10;
    Fault fault = 11;
    WorkflowCommand workflow_command = 12;
    NexusReply nexus_reply = 13;
    NexusCompletion nexus_completion = 14;
    // Starts holding what a control, by id, holds; and lets it go.
    string hold = 15;
    string release = 16;
    AttemptFailure attempt_failure = 17;
    // Answers the attempt an activity script's command runs in as canceled.
    Empty attempt_canceled = 19;
  }
  // The exhaustive kinds of evidence, by id, this command's read is the closing read of: the read
  // after which their sources report nothing more.
  repeated string closes = 18;
}

message After {
  repeated string commands = 1;
}

// A unary call on an endpoint role: the request its assignments build, and what it reads out of the
// response.
message Rpc {
  string role = 1;
  // The full method name, "/package.Service/Method".
  string method = 2;
  repeated Assignment assign = 3;
  repeated ResponseRead reads = 4;
}

message Assignment {
  // A field path of the request.
  string target = 1;
  Operand value = 2;
}

message ResponseRead {
  // A field path of the response.
  string path = 1;
  enum Cardinality {
    CARDINALITY_UNSPECIFIED = 0;
    CARDINALITY_ONE = 1;
    // One value per element of a repeated path.
    CARDINALITY_EACH = 2;
  }
  Cardinality cardinality = 2;
  repeated Target targets = 3;
}

// Where a read value goes.
message Target {
  oneof target {
    // An observation, by id.
    string observe = 1;
    // A learned value, by id, which this read binds.
    string bind = 2;
    // The evidence kinds a history read confirms, lifted into the observation of this id.
    string lift = 3;
  }
}

// Polls the read an evidence kind names until an element satisfies `until`.
message Poll {
  // An Evidence, by id.
  string evidence = 1;
  string role = 2;
  repeated Assignment assign = 3;
  Operand until = 4;
  int64 interval_ms = 5;
}

// Completes with a result: the workflow a workflow script runs in, or the attempt a command of an
// activity script runs in.
message Finish {
  Operand result = 1;
}

// Fails the attempt an activity script's command runs in, with a temporal.api.failure.v1.Failure.
message AttemptFailure {
  Proto failure = 1;
}

// A deliberate outage of the worker that polls a task-queue role.
message Fault {
  string role = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_WORKER_STOP = 1;
    KIND_WORKER_RESUME = 2;
    KIND_ADMISSION_RESPONSE_LOSS = 3;
  }
  Kind kind = 2;
}

// A workflow command, as the message the SDK would emit.
message WorkflowCommand {
  Proto command = 1;
}

// A Nexus handler's answer: a start response or a handler error.
message NexusReply {
  Proto reply = 1;
  // The handle, a learned value by id, an asynchronous answer binds; or empty.
  string binds = 2;
}

// Completes the asynchronous Nexus operation a handle names, with a payload or a failure.
message NexusCompletion {
  // A learned value, by id.
  string handle = 1;
  Proto result = 2;
}

// A value a command computes when it runs.
message Operand {
  Position position = 1;
  oneof kind {
    ProtoValue literal = 2;
    // An environment binding's value.
    string environment = 3;
    // The run's own id.
    Empty run = 4;
    // A learned value, by id.
    string learned_value = 5;
    // The value a poll is looking at, or the payload a Run Event's guard and key read.
    Empty projected = 6;
    PathOf path = 7;
    Present present = 8;
    Equal equal = 9;
    All all = 10;
    Greater greater = 11;
    Not not = 12;
  }
}

message PathOf {
  Operand of = 1;
  string path = 2;
}

message Present {
  Operand of = 1;
}

message Equal {
  Operand left = 1;
  Operand right = 2;
}

// Holds when every operand does, read left to right up to the first that does not.
message All {
  repeated Operand operands = 1;
}

// Holds when the left integer is greater than the right.
message Greater {
  Operand left = 1;
  Operand right = 2;
}

// Holds when its operand, a condition, does not.
message Not {
  Operand of = 1;
}


// A protobuf message written out: its fully qualified name and the fields it sets. A field it does
// not name stays unset.
message Proto {
  Position position = 1;
  string message = 2;
  repeated ProtoField fields = 3;
}

message ProtoField {
  // The field's protobuf name.
  string name = 1;
  ProtoValue value = 2;
}

message ProtoValue {
  oneof kind {
    string text = 1;
    bool flag = 2;
    int64 number = 3;
    // An enum value, by name.
    string enum_name = 4;
    // Bytes, as the UTF-8 text they encode.
    string utf8 = 5;
    Proto message = 6;
    ProtoMap mapping = 7;
    // A role, by id, where a field names the role a run resolves.
    string role_id = 8;
    Name named = 9;
  }
}

message ProtoMap {
  repeated ProtoEntry entries = 1;
}

message ProtoEntry {
  string key = 1;
  ProtoValue value = 2;
}
