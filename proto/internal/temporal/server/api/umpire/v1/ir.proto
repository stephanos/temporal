// The Umpire model IR: a semantic transition system, independent of the language a Model is authored
// in. A front end (model/irgen lifts Scala) emits it; the Go reader in tools/umpire/{ir,interp,check}
// validates it, interprets it, and derives every table, identity and fingerprint from it. Like the
// Testpilot protocol, it is an internal wire with no compatibility promise. The
// evaluation rules are written in model/SEMANTICS.md; neither front end nor interpreter
// defines them.
//
// The IR carries declarations, never derived tables: steps are pure functions over values, and the
// tables are what the interpreter computes from them.
syntax = "proto3";

package temporal.server.api.umpire.v1;

option go_package = "go.temporal.io/server/api/umpire/v1;umpire";
option java_multiple_files = true;
option java_package = "io.temporal.server.api.umpire.v1";

import "temporal/server/api/umpire/v1/claim.proto";
import "temporal/server/api/umpire/v1/expression.proto";
import "temporal/server/api/umpire/v1/machine.proto";
import "temporal/server/api/umpire/v1/realization.proto";
import "temporal/server/api/umpire/v1/value.proto";

// A Model: its types, its pure functions, its actions, and its machines.
// It also carries the declarations checks read over them.
message Model {
  // Where the Model was lifted from, for diagnostics and provenance.
  string source = 1;
  repeated Type types = 2;
  repeated Function functions = 3;
  repeated Action actions = 4;
  repeated Machine machines = 5;
  // The IR's major version. model/SEMANTICS.md defines version 0, which every Model written
  // before this field was is in; a reader rejects a version it does not know.
  uint32 version = 6;
  repeated Channel channels = 7;
  repeated Monitor monitors = 8;
  repeated Assumption assumptions = 9;
  repeated Hole holes = 10;
  repeated Composition compositions = 11;
  repeated Property properties = 12;
  repeated Scenario scenarios = 13;
  repeated Query queries = 14;
  repeated Progress progress = 15;
  repeated Realization realizations = 16;
}
