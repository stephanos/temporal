syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/api/command/v1/message.proto";
import "temporal/api/common/v1/message.proto";
import "temporal/api/failure/v1/message.proto";
import "temporal/api/nexus/v1/message.proto";
import "temporal/server/api/testpilot/v1/correlated.proto";
import "temporal/server/api/testpilot/v1/expression.proto";
import "temporal/server/api/testpilot/v1/source.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// InstructionNode is one node of an entrypoint's instruction graph: the instruction and when it runs.
// What it does not declare, preparation derives: its outcome fields follow from its instruction, and
// the worker activations it reserves from the Profile's reservation carriers.
message InstructionNode {
  string instruction_id = 1;
  Instruction instruction = 2;
  // The instructions that must finish or be skipped before this one is ready. Absent, it is the
  // previous instruction of the same entrypoint, or none for the first.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: The field reads as the ordering it states; it is internal to Testpilot. --)
  After after = 3;
  // Evaluated once the instruction is ready; when false it is skipped and records no Run Event.
  // Absent, the instruction runs only when every instruction it runs after succeeded.
  Expression guard = 4;
  // Absent, both limits are the Program's declared instruction defaults, or else the Profile's. A
  // node with wait hints writes its timeout.
  InstructionLimits limits = 5;
  // The declared bounds a polling ReadEvidence waits within, each with the hint it comes from. Set,
  // the node writes its own timeout, which must equal the sum of their bounds: no Profile default
  // applies to it, and the Profile's bound scale scales it. An expired wait names them.
  repeated WaitHint wait_hints = 6;
}

// WaitHint is one declared bound a wait's timeout is the sum of, and where it is declared.
message WaitHint {
  // The Producer's identity for the hint, such as the Umpire IR id of a visibility or cause bound.
  string hint_id = 1;
  // Where the hint is declared, with its line.
  SourceLocation source = 2;
  // The hint's share of the wait's timeout; positive.
  // (-- api-linter: core::0140::prepositions=disabled
  //     aip.dev/not-precedent: The name is the hint's own "at most" bound; it is internal to Testpilot. --)
  int64 at_most_milliseconds = 3;
}

// After names the instructions of the same entrypoint an instruction runs after, possibly none. It is
// written only where that set is not the previous instruction.
message After { repeated InstructionReference instructions = 1; }

// Instruction is the complete version-one instruction table.
message Instruction {
  oneof instruction {
    InvokeRpc invoke_rpc = 1;
    AwaitSlot await_slot = 2;
    AwaitInstruction await_instruction = 3;
    Finish finish = 4;
    InjectFault inject_fault = 5;
    WorkflowCommand workflow_command = 6;
    NexusHandlerReply nexus_handler_reply = 7;
    NexusOperationCompletion nexus_operation_completion = 8;
    ReadEvidence read_evidence = 9;
    ActivityAttemptFailure activity_attempt_failure = 10;
    ActivityAttemptCancellation activity_attempt_cancellation = 11;
    ActivityAttemptWithholding activity_attempt_withholding = 12;
  }
}

// InvokeRpc calls one authorized unary gRPC method on an endpoint role. It builds the request from
// assignments and reads declared values out of a successful response.
message InvokeRpc {
  string endpoint_role_id = 1;
  // The full method name, "/package.Service/Method".
  string method = 2;
  repeated RequestAssignment request_assignments = 3;
  repeated ResponseRead response_reads = 4;
}

// RequestAssignment sets the request field at target to its value, evaluated at dispatch. Targets
// may not overlap, fan out or select presence.
message RequestAssignment {
  // A field path in the grammar PathExpression.path documents.
  string target = 1;
  Expression value = 2;
}

// ResponseRead reads the value at path in a successful RPC response into its targets. An absent value
// is not read.
message ResponseRead {
  // A field path in the grammar PathExpression.path documents.
  string path = 1;
  ReadCardinality cardinality = 2;
  repeated ReadTarget targets = 3;
}

// ReadCardinality says whether a response read supplies one value, or one value per element of a
// repeated path. A read that emits each element cannot write a Slot.
// (-- api-linter: core::0191::file-layout=disabled --)
enum ReadCardinality {
  READ_CARDINALITY_UNSPECIFIED = 0;
  READ_CARDINALITY_ONE = 1;
  READ_CARDINALITY_EMIT_EACH = 2;
}

// ReadTarget is where a response read delivers its value: a Slot, an Observation, or CorrelatedEvidence
// lifted from the value.
message ReadTarget {
  oneof target {
    string slot_id = 1;
    string observation_id = 2;
    CorrelatedEvidenceProjection correlated_evidence = 3;
  }
}

// AwaitSlot waits, in a controller, until a Slot is written.
message AwaitSlot { string slot_id = 1; }

// AwaitInstruction waits, in a workflow, for the Nexus operation or the activity an earlier schedule
// command (`WorkflowCommand`) of the same entrypoint started; its outcome value is the payload the
// operation or the activity answered.
message AwaitInstruction { InstructionReference instruction = 1; }

// Finish completes with result: the workflow of a workflow entrypoint, or the attempt of an activity
// entrypoint and with it the activity. The result is a value whatever its type; an attempt fails only
// through ActivityAttemptFailure, is answered as canceled only through ActivityAttemptCancellation
// and goes unanswered only through ActivityAttemptWithholding.
message Finish { Expression result = 1; }

// ActivityAttemptFailure fails the attempt of an activity entrypoint with failure, an application
// failure or one that names no kind. The server retries the activity unless the failure says it is
// not retryable, so an attempt that fails retryably is followed by the entrypoint's next instruction
// and one that does not ends the activity.
message ActivityAttemptFailure { temporal.api.failure.v1.Failure failure = 1; }

// ActivityAttemptCancellation answers the attempt of an activity entrypoint as canceled. A worker
// answers so only what the server asked it to cancel, and learns of that through the attempt's
// heartbeat: the attempt heartbeats until the server reports the activity's cancellation requested
// and then offers the canceled answer, which ends the activity once the server accepts it. An
// attempt whose cancellation the server never requests offers nothing the Program declared.
message ActivityAttemptCancellation {}

// ActivityAttemptWithholding withholds the answer of the attempt of an activity entrypoint: the
// worker offers nothing until the attempt's deadline, the start-to-close or schedule-to-close
// timeout the server applies to it, ends the attempt, so the server times the attempt out. The
// server retries a timed-out attempt unless the retry policy is exhausted, so it is followed by the
// entrypoint's next instruction or ends the activity.
message ActivityAttemptWithholding {}

// InjectFault asks the Driver for one deliberate outage or delivery control. role_id must name a
// ROLE_KIND_TASK_QUEUE role; that role's resource binding identifies the affected queue.
message InjectFault {
  string role_id = 1;
  FaultKind kind = 2;
}

// FaultKind names the deliberate outages and delivery controls a Driver can realize. The worker
// values are worker-lifecycle transitions on one activation queue. The delivery values reach the
// server: a Driver realizes them only where its environment supplies a delivery control, and
// refuses them before any I/O otherwise.
// (-- api-linter: core::0216::synonyms=disabled --)
enum FaultKind {
  FAULT_KIND_UNSPECIFIED = 0;
  FAULT_KIND_WORKER_STOP = 1;
  FAULT_KIND_WORKER_RESUME = 2;
  // Succeeds once the server holds a validated dispatch of the activity the Run starts on the
  // role's queue, before the dispatch reaches matching. The Driver arms the hold before it sends
  // the activity's start, so no dispatch of that activity passes it unheld.
  FAULT_KIND_DELIVERY_HOLD = 3;
  // Releases the held dispatch and delivers it to the server's authoritative admission. It
  // succeeds once the admission's decision is observed after the decision committed, and its
  // outcome carries that decision as its delivery admission; an admission whose decision cannot be
  // observed is no success.
  FAULT_KIND_DELIVERY_RELEASE = 4;
  // Releases a held dispatch and replaces one committed admission response with Unavailable.
  // Succeeds only once a correlated retry proves the caller consumed the replacement; its outcome
  // retains the original durable admission, not the retry's answer.
  FAULT_KIND_ADMISSION_RESPONSE_LOSS = 5;
}

// WorkflowCommand issues one workflow command from a workflow entrypoint, carrying the command the
// SDK would emit: its type and the attributes of that type, the same message the action's schema
// names. The Driver maps the attributes to the SDK call that issues the command, so the Profile
// admits commands per command type, and a field the Driver cannot set through the SDK rejects at
// preparation naming it. An attributes field that names a Nexus endpoint names the Case's endpoint
// role rather than a resource, and one that names an activity's task queue names a task-queue role;
// the role's binding supplies the resource at dispatch. A schedule-to-close timeout the attributes
// leave absent is the instruction's own timeout.
message WorkflowCommand { temporal.api.command.v1.Command command = 1; }

// NexusHandlerReply answers the Nexus operation that activated a Nexus handler entrypoint with the
// reply the handler would return: a start response, synchronous with its payload, asynchronous
// through a completion handle the Driver issues, or failed; or a handler error with its type,
// message and retry behavior. The Driver issues the operation token, so an asynchronous response
// carries none.
message NexusHandlerReply {
  oneof reply {
    temporal.api.nexus.v1.StartOperationResponse response = 1;
    temporal.api.nexus.v1.HandlerError error = 2;
  }
  // For an asynchronous response, the opaque Slot that receives the operation's completion handle.
  string handle_slot_id = 3;
}

// NexusOperationCompletion completes, from a controller, the asynchronous Nexus operation whose
// handle a Slot holds, with what the completion callback carries: the operation's result payload, or
// the failure it ends with, canceled when the failure says so and failed otherwise.
message NexusOperationCompletion {
  string handle_slot_id = 1;
  oneof result {
    temporal.api.common.v1.Payload payload = 2;
    temporal.api.failure.v1.Failure failure = 3;
  }
}

// ReadEvidence polls, from a controller, the RPC the read-source EvidenceDeclaration it names reads
// through, until a value of the declared path satisfies `until` or the instruction's timeout
// expires, and then lifts every value `until` selects into the declaration's evidence. The values
// are the elements of the declared repeated field, or the one message of a single read. The request
// is built from the assignments once, at dispatch, and sent again after each interval; a poll that
// fails is the instruction's outcome. A read once sends it one time and records like a poll: a
// value that satisfies `until` lifts as a poll's would, and a response none satisfies ends the
// instruction as a poll whose timeout ran out, TIMED_OUT and with no evidence.
message ReadEvidence {
  string evidence_id = 1;
  string endpoint_role_id = 2;
  repeated RequestAssignment request_assignments = 3;
  // A boolean over the projected value, one value of the declared path.
  Expression until = 4;
  // Positive for a poll, at most the instruction's timeout; zero for a read once.
  int64 poll_interval_milliseconds = 5;
  // Reads once, for a read the effect it waits for is visible to at once: the condition is
  // checked once, and no wait hint applies.
  bool once = 6;
}

// InstructionLimits are the bounds that carry an instruction's behavior. Its resource ceilings are
// the Profile's ProgramLimits. A limit is written only where it differs from the Profile's instruction
// default, which an absent limit takes.
message InstructionLimits {
  oneof timeout {
    // Deadline of each dispatch, within the Profile's total duration; when it expires the outcome is
    // TIMED_OUT.
    int64 timeout_milliseconds = 1;
  }
  oneof attempts {
    // The highest attempt number the instruction may reach, within the Profile's attempts.
    int64 max_attempts = 2;
  }
}

// InstructionOutcomeStatus classifies one instruction attempt. A protocol failure is a non-OK RPC
// status; an SDK failure is a worker SDK error.
// Instruction outcome Status is normative Testpilot terminology.
// (-- api-linter: core::0191::file-layout=disabled
//     core::0216::synonyms=disabled --)
// (-- api-linter: core::0216::synonyms=disabled --)
enum InstructionOutcomeStatus {
  INSTRUCTION_OUTCOME_STATUS_UNSPECIFIED = 0;
  INSTRUCTION_OUTCOME_STATUS_SUCCEEDED = 1;
  INSTRUCTION_OUTCOME_STATUS_PROTOCOL_FAILURE = 2;
  INSTRUCTION_OUTCOME_STATUS_SDK_FAILURE = 3;
  INSTRUCTION_OUTCOME_STATUS_TIMED_OUT = 4;
  INSTRUCTION_OUTCOME_STATUS_CANCELED = 5;
}
