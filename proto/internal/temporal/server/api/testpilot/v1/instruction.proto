syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/expression.proto";
import "temporal/server/api/testpilot/v1/value.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

message RequestAssignment { FieldPath target = 1; ProgramExpression value = 2; }
// (-- api-linter: core::0191::file-layout=disabled --)
enum ProjectionKind {
  PROJECTION_KIND_UNSPECIFIED = 0;
  PROJECTION_KIND_ONE = 1;
  PROJECTION_KIND_EMIT_EACH = 2;
}
// ScopedEvidenceBinding names one ScopedEvidence slot and what supplies it: a path read from the
// projected value, or a literal the Case declares. A Run coordinate that the recorded fact does not
// itself carry is declared, never invented from Driver state.
message ScopedEvidenceBinding {
  string field_id = 1;
  oneof value {
    FieldPath path = 2;
    string literal = 3;
  }
}

// ScopedEvidenceRule lifts one recorded fact into a ScopedEvidence value. `guard` selects the rule:
// it fires only where that path resolves and, when `guard_equals_text` is set, only where it reads
// exactly that text. So one rule per recorded kind selects itself and `kind` is the literal the
// selected shape denotes. Every path is read from the projected value; no Run field, wall clock or
// Driver state is reachable from here.
message ScopedEvidenceRule {
  FieldPath guard = 1;
  repeated ScopedEvidenceBinding scope = 2;
  string source = 3;
  FieldPath operation = 5;
  string kind = 6;
  repeated ScopedEvidenceBinding fields = 7;
  string guard_equals_text = 8;
  reserved 4;
}

// ScopedEvidenceProjection is the Program-declared source of the ScopedEvidence a scoped capability
// reads. Its rules are tried in declaration order and the first whose guard resolves supplies the
// Observation; a projected value no rule claims emits nothing.
//
// A source ordinal is the position of the evidence in this source's own dense stream, so it is the
// count of values this lift has already emitted from the same projected list rather than anything
// read out of the value. The projector requires exactly that: independent sources have independent
// zero-based ordinals, and only the emitter can count them.
message ScopedEvidenceProjection {
  string observation_id = 1;
  repeated ScopedEvidenceRule rules = 2;
}

message ProjectionTarget {
  oneof target {
    string slot_id = 1;
    string observation_id = 2;
    ScopedEvidenceProjection scoped_evidence = 3;
  }
}
message ResponseProjection {
  FieldPath source = 1;
  ProjectionKind kind = 2;
  repeated ProjectionTarget targets = 3;
}

message InstructionLimits {
  int64 timeout_milliseconds = 1;
  int64 max_attempts = 2;
  int64 max_emitted_events = 3;
  int64 max_response_bytes = 4;
}
message InvokeRPC {
  string endpoint_role_id = 1;
  string method = 2;
  repeated RequestAssignment request_assignments = 3;
  repeated ResponseProjection response_projections = 4;
}
message AwaitSlot { string slot_id = 1; }
message CompleteNexusOperation { string capability_slot_id = 1; ProgramExpression result = 2; }
message StartNexusOperation {
  string endpoint_role_id = 1;
  string service = 2;
  string operation = 3;
  ProgramExpression input = 4;
}
message AwaitInstruction { InstructionRef instruction = 1; }
message Finish { ProgramExpression result = 1; }
enum NexusResponseKind {
  NEXUS_RESPONSE_KIND_UNSPECIFIED = 0;
  NEXUS_RESPONSE_KIND_SYNCHRONOUS = 1;
  NEXUS_RESPONSE_KIND_ASYNCHRONOUS = 2;
  NEXUS_RESPONSE_KIND_ERROR = 3;
}
message RespondNexus {
  NexusResponseKind kind = 1;
  ProgramExpression result = 2;
  string capability_slot_id = 3;
}

// FaultKind names the version-one deliberate outages a Driver can realize. Every value is a
// worker-lifecycle transition on one activation queue; nothing here reaches the server.
// (-- api-linter: core::0216::synonyms=disabled --)
enum FaultKind {
  FAULT_KIND_UNSPECIFIED = 0;
  FAULT_KIND_WORKER_STOP = 1;
  FAULT_KIND_WORKER_RESUME = 2;
}

// InjectFault asks the Driver for one deliberate outage. role_id must name a
// ROLE_KIND_TASK_QUEUE role; that role's resource binding identifies the affected queue.
message InjectFault {
  string role_id = 1;
  FaultKind kind = 2;
}

// FaultInjected is the recorded fact that a Driver realized one requested outage. It lives beside
// the instruction so the FaultKind accessor stays in the file that declares the enum.
message FaultInjected {
  string role_id = 1;
  FaultKind kind = 2;
}

// Instruction is the complete version-one instruction table.
message Instruction {
  oneof instruction {
    InvokeRPC invoke_rpc = 1;
    AwaitSlot await_slot = 2;
    CompleteNexusOperation complete_nexus_operation = 3;
    StartNexusOperation start_nexus_operation = 4;
    AwaitInstruction await_outcome = 5;
    Finish finish = 6;
    RespondNexus respond_nexus = 7;
    InjectFault inject_fault = 8;
  }
}

message ActivationReservationDefinition { string entrypoint_id = 1; int64 count = 2; }
message InstructionDefinition {
  string instruction_id = 1;
  repeated InstructionRef dependencies = 2;
  ProgramExpression guard = 3;
  Instruction instruction = 4;
  InstructionOutcomeDefinition outcome = 5;
  InstructionLimits limits = 6;
  repeated ActivationReservationDefinition activation_reservations = 7;
}
