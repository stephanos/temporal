syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/instruction.proto";
import "temporal/server/api/testpilot/v1/outcome.proto";
import "temporal/server/api/testpilot/v1/value.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// Result and lifecycle enums use the public Testpilot Status vocabulary.
// (-- api-linter: core::0191::file-layout=disabled
//     core::0216::synonyms=disabled --)
enum RunEventKind {
  RUN_EVENT_KIND_UNSPECIFIED = 0;
  RUN_EVENT_KIND_RUN_OPENED = 1;
  RUN_EVENT_KIND_ACTIVATION_OPENED = 2;
  RUN_EVENT_KIND_INSTRUCTION_STARTED = 3;
  RUN_EVENT_KIND_INSTRUCTION_COMPLETED = 4;
  RUN_EVENT_KIND_INSTRUCTION_TIMED_OUT = 5;
  RUN_EVENT_KIND_ACTIVATION_CLOSED = 6;
  RUN_EVENT_KIND_CLEANUP_STARTED = 7;
  RUN_EVENT_KIND_CLEANUP_COMPLETED = 8;
  RUN_EVENT_KIND_RUN_CLOSED = 9;
  RUN_EVENT_KIND_DIAGNOSTIC = 10;
  RUN_EVENT_KIND_FAULT_INJECTED = 11;
}
message RunEventFilter { repeated RunEventKind kinds = 1; }
message RunEventCoordinates {
  string entrypoint_id = 1;
  string activation_id = 2;
  string instruction_id = 3;
  int64 attempt = 4;
  int64 emitted_index = 5;
}
message ObservationResult { string observation_id = 1; Value value = 2; }

// RunEvent is an immutable fact at one Executor-recorded monotonic coordinate.
message RunEvent {
  int64 sequence = 1;
  int64 elapsed_milliseconds = 2;
  RunEventKind kind = 3;
  RunEventCoordinates coordinates = 4;
  string source_id = 5;
  repeated string causal_source_ids = 6;
  InstructionOutcome outcome = 7;
  repeated ObservationResult observations = 8;
  // Set before evaluation of the first event establishing execution incompleteness.
  // Incompleteness remains effective for every later event.
  bool execution_incomplete = 9;
  // Carried only by RUN_EVENT_KIND_FAULT_INJECTED events; it names the realized fault.
  FaultInjected fault_injected = 10;
}
// (-- api-linter: core::0216::synonyms=disabled --)
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_COMPLETED = 1;
  RUN_STATUS_STOPPED_BY_MONITOR = 2;
  RUN_STATUS_INCOMPLETE = 3;
}
// (-- api-linter: core::0216::synonyms=disabled --)
enum CleanupStatus {
  CLEANUP_STATUS_UNSPECIFIED = 0;
  CLEANUP_STATUS_SUCCEEDED = 1;
  CLEANUP_STATUS_FAILED = 2;
  CLEANUP_STATUS_TIMED_OUT = 3;
}
message CleanupOutcome { CleanupStatus status = 1; repeated string diagnostic_ids = 2; }
enum RunDiagnosticKind {
  RUN_DIAGNOSTIC_KIND_UNSPECIFIED = 0;
  RUN_DIAGNOSTIC_KIND_EXECUTION = 1;
  RUN_DIAGNOSTIC_KIND_MONITOR = 2;
  RUN_DIAGNOSTIC_KIND_RECORDER = 3;
  RUN_DIAGNOSTIC_KIND_INVARIANT = 4;
  RUN_DIAGNOSTIC_KIND_LIMIT = 5;
  RUN_DIAGNOSTIC_KIND_DRIVER_CONTRACT = 6;
  RUN_DIAGNOSTIC_KIND_POST_CLOSE_EVENT = 7;
}
message RunDiagnostic {
  string diagnostic_id = 1;
  RunDiagnosticKind kind = 2;
  string code = 3;
  string detail = 4;
  oneof support {
    int64 supporting_event_sequence = 5;
  }
}
// (-- api-linter: core::0216::synonyms=disabled --)
enum RuleVerdictStatus {
  RULE_VERDICT_STATUS_UNSPECIFIED = 0;
  RULE_VERDICT_STATUS_PENDING = 1;
  RULE_VERDICT_STATUS_SATISFIED = 2;
  RULE_VERDICT_STATUS_VIOLATED = 3;
  RULE_VERDICT_STATUS_INCONCLUSIVE = 4;
}
message RuleVerdict {
  string rule_id = 1;
  RuleVerdictStatus status = 2;
  string terminal_state_id = 3;
  repeated int64 supporting_event_sequences = 4;
}
// (-- api-linter: core::0216::synonyms=disabled --)
enum VerdictStatus {
  VERDICT_STATUS_UNSPECIFIED = 0;
  VERDICT_STATUS_SATISFIED = 1;
  VERDICT_STATUS_VIOLATED = 2;
  VERDICT_STATUS_INCONCLUSIVE = 3;
}
message Verdict {
  VerdictStatus status = 1;
  repeated RuleVerdict rules = 2;
  repeated int64 supporting_event_sequences = 3;
}

// Run is the authoritative append-only record of one attempted Program execution.
message Run {
  string run_id = 1;
  string case_id = 2;
  string program_id = 3;
  repeated RunEvent events = 4;
  RunStatus status = 5;
  CleanupOutcome cleanup = 6;
  Verdict verdict = 7;
  repeated RunDiagnostic diagnostics = 8;
  // First event whose Monitor callback failed; its staged evaluation did not commit.
  // Recorded after the callback, without changing the appended event.
  oneof evaluation_failure {
    int64 evaluation_failure_sequence = 9;
  }
}

// ScopedEvidence is supplied only through the capability's declared typed Observation.
// Source ordinals and parents carry semantic order; Run elapsed time never supplies a tick.
message ScopedBinding { string field_id = 1; string value = 2; }
message ScopedIdentity {
  repeated ScopedBinding scope = 1;
  string source = 2;
  int64 ordinal = 3;
}
message ScopedEvidenceField { string field_id = 1; Value value = 2; }
message ScopedEvidence {
  ScopedIdentity identity = 1;
  string operation = 2;
  string kind = 3;
  repeated ScopedIdentity parents = 4;
  repeated ScopedEvidenceField fields = 6;
}
