syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/expression.proto";
import "temporal/server/api/testpilot/v1/run.proto";
import "temporal/server/api/testpilot/v1/value.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// Contract lifecycle enums use the public Testpilot Status vocabulary.
// (-- api-linter: core::0191::file-layout=disabled
//     core::0216::synonyms=disabled --)
enum ContractRuleKind {
  CONTRACT_RULE_KIND_UNSPECIFIED = 0;
  CONTRACT_RULE_KIND_SAFETY = 1;
  CONTRACT_RULE_KIND_BOUNDED_LIVENESS = 2;
}
// (-- api-linter: core::0216::synonyms=disabled --)
enum ContractStateStatus {
  CONTRACT_STATE_STATUS_UNSPECIFIED = 0;
  CONTRACT_STATE_STATUS_NONTERMINAL = 1;
  CONTRACT_STATE_STATUS_SATISFIED = 2;
  CONTRACT_STATE_STATUS_VIOLATED = 3;
}
message ContractStateDefinition { string state_id = 1; ContractStateStatus status = 2; }
message ContractCaptureType {
  oneof type {
    ScalarType scalar = 1;
    NamedType enumeration = 2;
    NamedType message = 3;
  }
}
message ContractCaptureDefinition { string capture_id = 1; ContractCaptureType type = 2; }
message ContractCaptureAssignment { string capture_id = 1; ObservationRef observation = 2; }
enum ContractSupportKind {
  CONTRACT_SUPPORT_KIND_UNSPECIFIED = 0;
  CONTRACT_SUPPORT_KIND_NONE = 1;
  CONTRACT_SUPPORT_KIND_MATCHING_EVENT = 2;
}

// ContractTransitionDefinition is evaluated in declaration order for its source state and event kind.
message ContractTransitionDefinition {
  string transition_id = 1;
  string source_state_id = 2;
  string target_state_id = 3;
  RunEventFilter event_filter = 4;
  ContractExpression predicate = 5;
  ContractSupportKind support_kind = 6;
  repeated ContractCaptureAssignment capture_assignments = 7;
}
// ContractDeadline bounds one liveness rule. Exactly one bound is positive.
// elapsed_milliseconds expires the rule at the first Run Event whose elapsed coordinate
// reaches it; that coordinate is derived from the recording host's clock, so a bound
// expressed in it is host-clock dependent.
// rule_events expires the rule after that many Run Events were evaluated by the rule since
// its last transition into a new state. The counter resets on each such transition and stops
// once the rule reaches a terminal state. It also freezes, with every other rule effect, once
// execution becomes incomplete, so no expiry is ever concluded from a truncated Run.
message ContractDeadline {
  int64 elapsed_milliseconds = 1;
  string violation_state_id = 2;
  int64 rule_events = 3;
}

// ContractRuleDefinition is one finite deterministic safety or bounded-liveness monitor machine.
message ContractRuleDefinition {
  string rule_id = 1;
  ContractRuleKind kind = 2;
  string initial_state_id = 3;
  repeated ContractStateDefinition states = 4;
  repeated ContractTransitionDefinition transitions = 5;
  ContractDeadline deadline = 6;
  repeated ContractCaptureDefinition captures = 7;
}
message ContractLimits {
  int64 max_rules = 1;
  int64 max_states = 2;
  int64 max_transitions = 3;
  int64 max_expression_depth = 4;
  int64 max_work_per_event = 5;
  int64 max_total_work = 6;
  int64 max_captures = 7;
  int64 max_capture_bytes = 8;
}

// Contract contains only closed deterministic monitor machines over declared Run Observations.
message Contract {
  string contract_id = 1;
  repeated ContractRuleDefinition rules = 2;
  ContractLimits limits = 3;
  CorrelatedContract correlated = 4;
}

// CorrelatedContract v1 projects causally ordered evidence before ticking operation-local windows.
message CorrelatedContract {
  int32 version = 1;
  string projection_id = 2;
  string projection_fingerprint = 3;
  string evidence_observation_id = 4;
  repeated string scope_fields = 5;
  string operation_field = 6;
  repeated string sources = 7;
  CorrelatedValue initial_state = 8;
  repeated CorrelatedTransition transitions = 9;
  repeated CorrelatedProjectionRule projection_rules = 10;
  repeated CorrelatedRule clauses = 11;
  CorrelatedLimits limits = 12;
}
message CorrelatedValue { string definition_id = 1; string value = 2; }
message CorrelatedTransition {
  CorrelatedValue prior_state = 1;
  CorrelatedValue action = 2;
  CorrelatedValue state = 3;
  CorrelatedValue outcome = 4;
  repeated CorrelatedValue facts = 5;
}
enum CorrelatedEvidenceMeaning {
  CORRELATED_EVIDENCE_MEANING_UNSPECIFIED = 0;
  CORRELATED_EVIDENCE_MEANING_IRRELEVANT = 1;
  CORRELATED_EVIDENCE_MEANING_SUBMISSION = 2;
  CORRELATED_EVIDENCE_MEANING_CONFIRMED = 3;
}
enum CorrelatedFieldDisposition {
  CORRELATED_FIELD_DISPOSITION_UNSPECIFIED = 0;
  CORRELATED_FIELD_DISPOSITION_RETAIN = 1;
  CORRELATED_FIELD_DISPOSITION_REDACT = 2;
  CORRELATED_FIELD_DISPOSITION_REJECT = 3;
}
message CorrelatedFieldPolicy {
  string field_id = 1;
  ScalarType type = 2;
  CorrelatedFieldDisposition disposition = 3;
}
message CorrelatedProjectionRule {
  string kind = 1;
  CorrelatedEvidenceMeaning meaning = 2;
  CorrelatedValue submission = 3;
  // Output rows omit prior_state; the complete transition table checks continuity at admission.
  repeated CorrelatedTransition outputs = 4;
  repeated CorrelatedFieldPolicy fields = 5;
}
enum CorrelatedClock {
  CORRELATED_CLOCK_UNSPECIFIED = 0;
  CORRELATED_CLOCK_OPERATION_TRANSITIONS = 1;
}
enum TraceEnding {
  TRACE_ENDING_UNSPECIFIED = 0;
  TRACE_ENDING_PARTIAL = 1;
  TRACE_ENDING_FINAL = 2;
}
enum CorrelatedPredicateField {
  CORRELATED_PREDICATE_FIELD_UNSPECIFIED = 0;
  CORRELATED_PREDICATE_FIELD_ACTION = 1;
  CORRELATED_PREDICATE_FIELD_OUTCOME = 2;
  CORRELATED_PREDICATE_FIELD_STATE = 3;
  CORRELATED_PREDICATE_FIELD_FACT = 4;
}
message CorrelatedPredicate {
  CorrelatedPredicateField field = 1;
  string definition_id = 2;
  oneof constraint {
    bool present = 3;
    string equals_text = 4;
  }
}

// CorrelatedCaptureDeclaration retains one declared evidence field of the operation's admitted steps.
// Occurrences are numbered from zero in admission order and never rewritten, so a correlation
// operand names an exact earlier occurrence rather than an implicit latest match. `lifetime` is how
// many occurrences one operation retains.
message CorrelatedCaptureDeclaration {
  string capture_id = 1;
  string field_id = 2;
  int64 lifetime = 3;
}
message CorrelatedCaptureRef {
  string capture_id = 1;
  int64 ordinal = 2;
}

// CorrelatedOperand reads only declared evidence: an exact literal, one declared evidence field of the
// step being admitted, or one retained earlier occurrence of a declared capture.
message CorrelatedOperand {
  oneof operand {
    Value literal = 1;
    string field_id = 2;
    CorrelatedCaptureRef capture = 3;
  }
}
enum CorrelatedComparisonOperator {
  CORRELATED_COMPARISON_OPERATOR_UNSPECIFIED = 0;
  CORRELATED_COMPARISON_OPERATOR_EQUAL = 1;
  CORRELATED_COMPARISON_OPERATOR_NOT_EQUAL = 2;
}
message CorrelatedComparison {
  CorrelatedComparisonOperator operator = 1;
  CorrelatedOperand left = 2;
  CorrelatedOperand right = 3;
}
message CorrelatedCorrelationGroup { repeated CorrelatedCorrelation operands = 1; }

// CorrelatedCorrelation decides whether a labeled transition is one of the operation's semantic steps.
// It never supplies a trigger or a response: the bounded countdown stays exactly the one the
// clause's trigger and response patterns describe. `all` and `any` are evaluated left to right and
// stop at the first decisive operand, so an operand an earlier one made irrelevant is never read.
message CorrelatedCorrelation {
  oneof condition {
    CorrelatedPredicate predicate = 1;
    CorrelatedComparison comparison = 2;
    CorrelatedCorrelationGroup all = 3;
    CorrelatedCorrelationGroup any = 4;
  }
}
message CorrelatedRule {
  string clause_id = 1;
  CorrelatedClock clock = 7;
  int64 bound = 8;
  TraceEnding ending = 9;
  CorrelatedPredicate trigger = 10;
  CorrelatedPredicate response = 11;
  repeated CorrelatedCaptureDeclaration captures = 12;
  CorrelatedCorrelation correlation = 13;
}
message CorrelatedLimits {
  int64 max_events = 1;
  int64 max_buffered = 2;
  int64 max_keys = 3;
  int64 max_support = 4;
  int64 max_projection_work = 5;
  int64 max_event_bytes = 6;
  int64 max_semantic_transitions = 7;
  int64 max_obligations = 8;
  int64 max_obligation_work = 9;
  // A capability declaring captures or a correlation must set both ceilings; one that declares
  // neither leaves both unset and keeps its exact existing encoding.
  int64 max_captures = 10;
  int64 max_correlation_depth = 11;
}
