syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/contract.proto";
import "temporal/server/api/testpilot/v1/program.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// Case is the versioned standalone pairing of exactly one bounded Program and one Contract.
message Case {
  string case_id = 1;
  FormatVersion version = 2;
  CaseProvenance provenance = 3;
  Program program = 4;
  Contract contract = 5;
}

// FormatVersion is the Case wire format version; preparation admits exactly 1.0.
message FormatVersion { int32 major = 1; int32 minor = 2; }

// CaseProvenance records where a Case came from as typed rows. Testpilot reads none of it: it
// changes no preparation, Run or Verdict, although it is part of the Case's canonical bytes. Each
// kind of row is its own list, in the order the Producer lists them.
message CaseProvenance {
  string producer_id = 1;
  string producer_version = 2;
  repeated DefinitionBinding definitions = 3;
  repeated SourceLocation sources = 4;
  repeated KnownGap known_gaps = 5;
  repeated CorrelatedRuleBinding correlated_rules = 6;
  repeated LocalName local_names = 7;
  repeated ModelValueFingerprint model_value_fingerprints = 8;
  repeated AbstractionClaim abstraction_claims = 9;
}

// AbstractionClaim records that this Case realized one class of one action's input field through
// the example its Model wrote for it. A class with an example stands for several concrete values the
// Model does not count, so the Case's Verdict is a claim about the class made through one of them.
message AbstractionClaim {
  // The Definition ID of the action whose class the Case realized.
  string action = 1;
  // The input field the class belongs to.
  string field = 2;
  // The class, spelled as the Model spells it.
  string class_name = 3;
  // The concrete example the Case used, spelled as the Model's example line spells it.
  string example = 4;
}

// DefinitionBinding names one source Model Definition a Case was produced from and the Behavior
// Fingerprint it had.
message DefinitionBinding {
  string definition_id = 1;
  string behavior_fingerprint = 2;
  DefinitionKind kind = 3;
}

// SourceLocation is a position in the Producer's source.
message SourceLocation {
  // Relative to the Producer's source root.
  string path = 1;
  // One-based; zero when the Producer knows no position.
  int32 line = 2;
  // One-based; zero when the Producer knows no position.
  int32 column = 3;
  // How the source was obtained, such as authored or checked-model.
  string provenance = 4;
}

// KnownGap is one missing or unsupported capability, input, interpretation or claim that limits what
// the Case can prove.
message KnownGap {
  KnownGapKind kind = 1;
  // The Known Gap's Definition ID.
  string code = 2;
  oneof subject_presence {
    // The Definition ID of the definition the gap limits.
    string subject = 3;
  }
  oneof detail_presence {
    string detail = 4;
  }
}

// CorrelatedRuleBinding ties one Correlated Rule of the Contract to the Property and Projection it
// was compiled from.
message CorrelatedRuleBinding {
  string rule_id = 1;
  string property_id = 2;
  string property_fingerprint = 3;
  string projection_id = 4;
  string projection_fingerprint = 5;
  SourceLocation source = 6;
}

// LocalName maps one Case-local name to the Definition ID it stands for. The Program and Contract name
// states, actions, outcomes, facts, evidence kinds, sources and fields, captures, projections and
// rules by Case-local names; a name no row maps is its own Definition ID. No two rows share a local
// name or a Definition ID.
message LocalName {
  // (-- api-linter: core::0122::name-suffix=disabled
  //     aip.dev/not-precedent: a Case-local name is the glossary term, not a resource name. --)
  string local_name = 1;
  string definition_id = 2;
}

// ModelValueFingerprint records one model value the Case spells differently from its canonical
// encoding: a parameterized value, or a value whose spelling collides with another encoding of its
// definition and so carries a fingerprint-derived disambiguator.
message ModelValueFingerprint {
  // The Case-local name of the definition that declares the value.
  // (-- api-linter: core::0122::name-suffix=disabled
  //     aip.dev/not-precedent: a Case-local name is the glossary term, not a resource name. --)
  string local_name = 1;
  // The value as the Case spells it.
  string spelling = 2;
  // The lowercase hexadecimal SHA-256 of the UTF-8 bytes of the value's canonical encoding.
  string fingerprint = 3;
}

// DefinitionKind classifies the source Model Definition a DefinitionBinding names.
enum DefinitionKind {
  DEFINITION_KIND_UNSPECIFIED = 0;
  DEFINITION_KIND_SETUP = 1;
  DEFINITION_KIND_STATE = 2;
  DEFINITION_KIND_ACTION = 3;
  DEFINITION_KIND_OUTCOME = 4;
  DEFINITION_KIND_FACT = 5;
  DEFINITION_KIND_RELATION = 6;
  DEFINITION_KIND_CAPABILITY = 7;
  DEFINITION_KIND_PROPERTY = 8;
  DEFINITION_KIND_QUERY = 9;
  DEFINITION_KIND_SCENARIO = 10;
  DEFINITION_KIND_TARGET = 11;
  DEFINITION_KIND_COMPILER = 12;
  DEFINITION_KIND_PROVIDER = 13;
  DEFINITION_KIND_LAW = 14;
  DEFINITION_KIND_CONNECTOR = 15;
  DEFINITION_KIND_MACHINE = 16;
}

// KnownGapKind classifies what a KnownGap is missing.
enum KnownGapKind {
  KNOWN_GAP_KIND_UNSPECIFIED = 0;
  KNOWN_GAP_KIND_CAPABILITY = 1;
  KNOWN_GAP_KIND_INPUT = 2;
  KNOWN_GAP_KIND_INTERPRETATION = 3;
  KNOWN_GAP_KIND_CLAIM = 4;
}
