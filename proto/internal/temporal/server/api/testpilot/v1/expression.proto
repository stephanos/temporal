syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/event.proto";
import "temporal/server/api/testpilot/v1/value.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// Expression is the one closed expression language of a Case: instruction inputs and guards,
// Contract transition predicates, correlated rule conditions and evidence-lift guards. Which
// references an expression may use is a property of where it appears, and preparation rejects a
// reference outside its context.
message Expression {
  oneof expression {
    Value literal = 1;
    Reference reference = 2;
    PathExpression path = 3;
    PresentExpression present = 4;
    CompareExpression compare = 5;
    // (-- api-linter: core::0140::reserved-words=disabled
    //     aip.dev/not-precedent: The negation arm is named like all and any; it is internal and generated Lean accepts it. --)
    NotExpression not = 6;
    AllExpression all = 7;
    AnyExpression any = 8;
  }
}

// PathExpression reads a FieldPath out of its operand's value, absent when any segment is absent.
message PathExpression { Expression operand = 1; FieldPath path = 2; }

// PresentExpression is true when its operand is not absent.
message PresentExpression { Expression operand = 1; }

// CompareExpression compares two operands of one type. EQUAL and NOT_EQUAL admit any type; the
// ordering operators admit only numeric scalars.
message CompareExpression { ComparisonOperator operator = 1; Expression left = 2; Expression right = 3; }

// NotExpression negates a boolean operand.
message NotExpression { Expression operand = 1; }

// AllExpression is true when every operand is true. Operands are evaluated left to right until
// one is false; an empty list is true.
message AllExpression { repeated Expression operands = 1; }

// AnyExpression is true when some operand is true. Operands are evaluated left to right until
// one is true; an empty list is false.
message AnyExpression { repeated Expression operands = 1; }

// ComparisonOperator names what a compare expression tests. NOT_EQUAL is the negation of EQUAL, and
// every ordering comparison with NaN is false.
// (-- api-linter: core::0191::file-layout=disabled --)
enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_EQUAL = 1;
  COMPARISON_OPERATOR_NOT_EQUAL = 2;
  COMPARISON_OPERATOR_LESS_THAN = 3;
  COMPARISON_OPERATOR_LESS_THAN_OR_EQUAL = 4;
  COMPARISON_OPERATOR_GREATER_THAN = 5;
  COMPARISON_OPERATOR_GREATER_THAN_OR_EQUAL = 6;
}

// Reference reads one value an expression's context supplies. Instruction inputs and guards admit
// Slots, instruction outcomes, the Run and environment bindings; Contract transition predicates admit
// Observations, Run Event fields and captures; correlated rule conditions admit evidence fields,
// correlated captures and correlated steps; evidence-lift guards admit the projected value.
message Reference {
  oneof reference {
    // The value assigned to a Slot, absent until the Slot is written.
    string slot_id = 1;
    InstructionOutcomeReference outcome = 2;
    RunReference run = 3;
    // A declared environment binding's value. It is admitted only as the whole value of an InvokeRpc
    // request assignment to a text field.
    string environment_binding_id = 4;
    // An Observation of the evaluated Run Event, absent when the event does not carry it.
    string observation_id = 5;
    RunEventReference run_event = 6;
    // A value the rule captured earlier, absent until it is assigned.
    string capture_id = 7;
    // One declared evidence field of the correlated step being admitted.
    string evidence_field_id = 8;
    CorrelatedCaptureReference correlated_capture = 9;
    // A literal model value. No context admits it yet: a correlated step reference and a text
    // literal carry the model values correlated conditions test.
    ModelValue model_value = 10;
    CorrelatedStepReference correlated_step = 11;
    // The value an evidence lift is projecting.
    ProjectedValueReference projected_value = 12;
  }
}

// InstructionReference names one instruction by its entrypoint and instruction ids.
message InstructionReference { string entrypoint_id = 1; string instruction_id = 2; }

// InstructionOutcomeReference reads one declared field of an earlier instruction's outcome.
message InstructionOutcomeReference { InstructionReference instruction = 1; InstructionOutcomeField field = 2; }

// InstructionOutcomeField names one field of an InstructionOutcome an expression may read.
enum InstructionOutcomeField {
  INSTRUCTION_OUTCOME_FIELD_UNSPECIFIED = 0;
  INSTRUCTION_OUTCOME_FIELD_STATUS = 1;
  INSTRUCTION_OUTCOME_FIELD_PROTOCOL_CODE = 2;
  INSTRUCTION_OUTCOME_FIELD_SDK_FAILURE_CODE = 3;
  INSTRUCTION_OUTCOME_FIELD_DETAIL = 4;
  INSTRUCTION_OUTCOME_FIELD_VALUE = 5;
}

// RunReference reads the Run id as text. Only InvokeRpc request assignments may use it.
message RunReference {}

// RunEventReference reads the evaluated Run Event: one of its coordinates, or its payload.
message RunEventReference {
  oneof selection {
    RunEventField field = 1;
    RunEventPayloadReference payload = 2;
  }
}

// RunEventPayloadReference selects the payload of the evaluated Run Event. It is read only as the
// operand of a path whose first segment names a payload arm, such as fault_injected.kind; that path
// is absent on an event carrying another arm or none.
message RunEventPayloadReference {}

// CorrelatedCaptureReference reads one retained occurrence of a capture by its zero-based ordinal.
message CorrelatedCaptureReference {
  string capture_id = 1;
  int64 ordinal = 2;
}

// CorrelatedStepReference reads the model value of definition_id at one part of the correlated step
// being admitted, absent when that part carries none. A FACT reference reads the step's facts: it is
// present when any fact has the definition, and it equals a literal when any such fact does.
message CorrelatedStepReference {
  CorrelatedStepField field = 1;
  // The Case-local name of the definition, as a ModelValue spells it.
  string definition_id = 2;
}

// CorrelatedStepField names the part of a correlated step a step reference reads.
// (-- api-linter: core::0191::file-layout=disabled --)
enum CorrelatedStepField {
  CORRELATED_STEP_FIELD_UNSPECIFIED = 0;
  CORRELATED_STEP_FIELD_ACTION = 1;
  CORRELATED_STEP_FIELD_OUTCOME = 2;
  CORRELATED_STEP_FIELD_STATE = 3;
  CORRELATED_STEP_FIELD_FACT = 4;
}

// ProjectedValueReference reads the value an evidence lift is projecting.
message ProjectedValueReference {}
