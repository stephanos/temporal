syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/event.proto";
import "cel/expr/syntax.proto";
import "cel/expr/value.proto";
import "google/protobuf/empty.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// Expression is the one closed expression language of a Case: instruction inputs and guards,
// Contract transition predicates, correlated rule conditions and evidence-lift guards. Which
// references an expression may use is a property of where it appears, and preparation rejects a
// reference outside its context.
message Expression {
  cel.expr.ParsedExpr cel = 1;
  repeated ExpressionBinding bindings = 2;
}

// ExpressionBinding supplies a typed domain value to one CEL variable. Paths use protobuf field
// names, optional oneof members, map selectors, wildcard projection and explicit presence. Their
// authority is checked against the owning Case catalog before native CEL checking.
message ExpressionBinding {
  string variable = 1;
  oneof input {
    Reference reference = 2;
    cel.expr.Value literal = 3;
  }
  string path = 4;
}

// Reference reads one value an expression's context supplies. Instruction inputs and guards admit
// Slots, instruction outcomes, the Run and environment bindings; Contract transition predicates admit
// Observations, Run Event fields, captures and instance values; correlated rule conditions admit
// evidence fields, correlated captures and correlated steps; evidence-lift guards admit the projected
// value.
message Reference {
  oneof reference {
    // The value assigned to a Slot, absent until the Slot is written.
    string slot_id = 1;
    InstructionOutcomeReference outcome = 2;
    google.protobuf.Empty run = 3;
    // A declared environment binding's value. It is admitted only as the whole value of an InvokeRpc
    // request assignment to a text field.
    string environment_binding_id = 4;
    // An Observation of the evaluated Run Event, absent when the event does not carry it.
    string observation_id = 5;
    RunEventReference run_event = 6;
    // A value the evaluated Rule instance captured earlier, absent until it is assigned.
    string capture_id = 7;
    // One declared evidence field of the correlated step being admitted.
    string evidence_field_id = 8;
    CorrelatedCaptureReference correlated_capture = 9;
    CorrelatedStepReference correlated_step = 10;
    // The value an evidence lift is projecting.
    google.protobuf.Empty projected_value = 11;
    // A value the evaluated Rule instance assigns; admitted only in a Contract transition predicate.
    string instance_value_id = 12;
  }
}

// InstructionReference names one instruction by its entrypoint and instruction ids.
message InstructionReference { string entrypoint_id = 1; string instruction_id = 2; }

// LocalInstructionReference is scoped to its enclosing entrypoint.
message LocalInstructionReference { string instruction_id = 1; }

// InstructionOutcomeReference reads one declared field of an earlier instruction's outcome.
message InstructionOutcomeReference { InstructionReference instruction = 1; InstructionOutcomeField field = 2; }

// InstructionOutcomeField names one field of an InstructionOutcome an expression may read.
enum InstructionOutcomeField {
  INSTRUCTION_OUTCOME_FIELD_UNSPECIFIED = 0;
  INSTRUCTION_OUTCOME_FIELD_STATUS = 1;
  INSTRUCTION_OUTCOME_FIELD_PROTOCOL_CODE = 2;
  INSTRUCTION_OUTCOME_FIELD_SDK_FAILURE_CODE = 3;
  INSTRUCTION_OUTCOME_FIELD_DETAIL = 4;
  INSTRUCTION_OUTCOME_FIELD_VALUE = 5;
}

// RunEventReference reads the evaluated Run Event: one of its coordinates, or its payload.
message RunEventReference {
  oneof selection {
    RunEventField field = 1;
    google.protobuf.Empty payload = 2;
  }
}

// CorrelatedCaptureReference reads one retained occurrence of a capture by its zero-based ordinal.
message CorrelatedCaptureReference {
  string capture_id = 1;
  int64 ordinal = 2;
}

// CorrelatedStepReference reads the model value of definition_id at one part of the correlated step
// being admitted, absent when that part carries none. A FACT reference reads the step's facts: it is
// present when any fact has the definition, and it equals a literal when any such fact does.
message CorrelatedStepReference {
  CorrelatedStepField field = 1;
  // The Case-local name of the definition, as a ModelValue spells it. With a STATE field this is
  // either the whole state's definition or one state field's, because a structured Model carries
  // its fields beside the state atom and each field is a model value under its own definition.
  string definition_id = 2;
}

// CorrelatedStepField names the part of a correlated step a step reference reads.
// (-- api-linter: core::0191::file-layout=disabled --)
enum CorrelatedStepField {
  CORRELATED_STEP_FIELD_UNSPECIFIED = 0;
  CORRELATED_STEP_FIELD_ACTION = 1;
  CORRELATED_STEP_FIELD_OUTCOME = 2;
  CORRELATED_STEP_FIELD_STATE = 3;
  CORRELATED_STEP_FIELD_FACT = 4;
}
