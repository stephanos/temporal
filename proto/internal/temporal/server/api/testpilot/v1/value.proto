syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "google/protobuf/any.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

message FormatVersion { int32 major = 1; int32 minor = 2; }

// (-- api-linter: core::0191::file-layout=disabled --)
enum ScalarKind {
  SCALAR_KIND_UNSPECIFIED = 0;
  SCALAR_KIND_TEXT = 1;
  SCALAR_KIND_NATURAL = 2;
  SCALAR_KIND_BOOLEAN = 3;
  SCALAR_KIND_BYTES = 4;
  SCALAR_KIND_INT32 = 5;
  SCALAR_KIND_INT64 = 6;
  SCALAR_KIND_UINT32 = 7;
  SCALAR_KIND_UINT64 = 8;
  SCALAR_KIND_SINT32 = 9;
  SCALAR_KIND_SINT64 = 10;
  SCALAR_KIND_FIXED32 = 11;
  SCALAR_KIND_FIXED64 = 12;
  SCALAR_KIND_SFIXED32 = 13;
  SCALAR_KIND_SFIXED64 = 14;
  SCALAR_KIND_FLOAT = 15;
  SCALAR_KIND_DOUBLE = 16;
}
message EnumValue { int32 number = 1; }
message ValueList { repeated Value values = 1; }
message ValueMapEntry { Value key = 1; Value value = 2; }

// Value is a tagged interpreter value. Naturals use canonical unsigned base-10 text.
// Signed and unsigned protobuf integers also use canonical base-10 text.
message Value {
  oneof value {
    string text = 1;
    string natural = 2;
    bool bool_value = 3;
    bytes bytes_value = 4;
    string signed_integer = 5;
    string unsigned_integer = 6;
    double floating_point = 7;
    EnumValue enum_value = 8;
    // (-- api-linter: core::0146::any=disabled
    //     aip.dev/not-precedent: Whole typed Any values are an explicit closed IR capability. --)
    google.protobuf.Any message_value = 9;
    ValueList list_value = 10;
    ValueMap map_value = 11;
  }
}
message ValueMap { repeated ValueMapEntry entries = 1; }
message ScalarType { ScalarKind kind = 1; }
message NamedType { string protobuf_type = 1; }
message AnyType {}
message OpaqueCapabilityType {}
message SingularType {
  oneof type {
    ScalarType scalar = 1;
    NamedType enumeration = 2;
    NamedType message = 3;
    AnyType any = 4;
    OpaqueCapabilityType opaque_capability = 5;
  }
}
message RepeatedType { SingularType element = 1; }
message MapType { ScalarType key = 1; SingularType value = 2; }
message ValueType {
  oneof shape {
    SingularType singular = 1;
    RepeatedType repeated = 2;
    MapType map = 3;
  }
}

message RepeatedWildcard {}
message MapKeySelector { Value key = 1; }
message PresenceSelector {}
message OneofSelector { string selected_field = 1; }
message FieldPathSegment {
  string field = 1;
  oneof selector {
    RepeatedWildcard repeated = 2;
    MapKeySelector map_key = 3;
    PresenceSelector presence = 4;
    OneofSelector oneof = 5;
  }
}
message FieldPath { repeated FieldPathSegment segments = 1; }

message SlotDefinition {
  string slot_id = 1;
  oneof content {
    ValueType value = 2;
    OpaqueCapabilityType opaque_capability = 3;
  }
}
message ObservationDefinition { string observation_id = 1; ValueType type = 2; }
