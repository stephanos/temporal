syntax = "proto3";
package temporal.server.api.testpilot.v1;
import "temporal/server/api/testpilot/v1/value.proto";
option go_package = "go.temporal.io/server/api/testpilot/v1;testpilot";

// CorrelatedContract v1 projects causally ordered evidence before ticking operation-local windows.
message CorrelatedContract {
  // The model Projection the contract was produced from; the runtime only checks it is an id.
  string projection_id = 1;
  // The Projection's fingerprint; the runtime only checks it is set.
  string projection_fingerprint = 2;
  // Always 1.
  int32 version = 3;
  // The Observation, of type CorrelatedEvidence, that supplies the evidence.
  string evidence_observation_id = 4;
  // The field ids, in order, that every evidence identity's scope carries.
  repeated string scope_fields = 5;
  // The evidence field naming the operation; it is not a scope field.
  string operation_field = 6;
  // The evidence sources identities and parents may name.
  repeated string sources = 7;
  // The state every new operation starts in.
  ModelValue initial_state = 8;
  // The complete transition table operations follow.
  repeated CorrelatedTransition transitions = 9;
  // What evidence of each kind does to its operation.
  repeated CorrelatedProjectionRule projection_rules = 10;
  repeated CorrelatedRule rules = 11;
  CorrelatedLimits limits = 12;
}

// ModelValue is one model value: the Definition ID that declares it and its value text.
message ModelValue { string definition_id = 1; string value = 2; }

// CorrelatedTransition is one row of the transition table: from prior_state, action leads to state
// with outcome and facts.
message CorrelatedTransition {
  ModelValue prior_state = 1;
  ModelValue action = 2;
  ModelValue state = 3;
  ModelValue outcome = 4;
  repeated ModelValue facts = 5;
}

// CorrelatedProjectionRule says what evidence of one kind means for its operation.
message CorrelatedProjectionRule {
  // The evidence kind the rule claims; unique among the rules.
  string kind = 1;
  CorrelatedEvidenceMeaning meaning = 2;
  // The submitted action; confirmed evidence that names it must have the submission as a causal parent.
  ModelValue submission = 3;
  // Output rows omit prior_state; the complete transition table checks continuity at admission.
  repeated CorrelatedTransition outputs = 4;
  // The fields evidence of this kind carries, and how each is treated.
  repeated CorrelatedFieldPolicy fields = 5;
}

// CorrelatedEvidenceMeaning says what evidence of a kind does: nothing, submit an action, or confirm
// transitions of its operation.
// (-- api-linter: core::0191::file-layout=disabled --)
enum CorrelatedEvidenceMeaning {
  CORRELATED_EVIDENCE_MEANING_UNSPECIFIED = 0;
  CORRELATED_EVIDENCE_MEANING_IRRELEVANT = 1;
  CORRELATED_EVIDENCE_MEANING_SUBMISSION = 2;
  CORRELATED_EVIDENCE_MEANING_CONFIRMED = 3;
}

// CorrelatedFieldPolicy declares one evidence field: its TEXT, NATURAL or BOOLEAN type, and how
// evidence must carry it.
message CorrelatedFieldPolicy {
  string field_id = 1;
  ScalarType type = 2;
  CorrelatedFieldDisposition disposition = 3;
}

// CorrelatedFieldDisposition says whether evidence carries a field with a value, carries it without
// one, or must not carry it. Only retained fields can be captured or compared.
enum CorrelatedFieldDisposition {
  CORRELATED_FIELD_DISPOSITION_UNSPECIFIED = 0;
  CORRELATED_FIELD_DISPOSITION_RETAIN = 1;
  CORRELATED_FIELD_DISPOSITION_REDACT = 2;
  CORRELATED_FIELD_DISPOSITION_REJECT = 3;
}

// CorrelatedRule obliges every operation step that matches trigger to be answered by a step that
// matches response, on the trigger step or within bound further steps of the same operation.
message CorrelatedRule {
  string rule_id = 1;
  // Tests the step's action.
  CorrelatedPredicate trigger = 2;
  // Tests the step's outcome, state or facts.
  CorrelatedPredicate response = 3;
  // Evidence fields retained for the correlation to compare.
  repeated CorrelatedCaptureDeclaration captures = 4;
  // When set, only the transitions it accepts are the operation's steps.
  CorrelatedCorrelation correlation = 5;
  // What bound counts.
  CorrelatedClock clock = 6;
  int64 bound = 7;
  // How an obligation still pending when the Run ends is decided.
  TraceEnding ending = 8;
}

// CorrelatedClock names what a correlated rule's bound counts.
enum CorrelatedClock {
  CORRELATED_CLOCK_UNSPECIFIED = 0;
  CORRELATED_CLOCK_OPERATION_TRANSITIONS = 1;
}

// TraceEnding decides an obligation still pending when the Run ends: a final trace violates it and a
// partial trace leaves it inconclusive.
enum TraceEnding {
  TRACE_ENDING_UNSPECIFIED = 0;
  TRACE_ENDING_PARTIAL = 1;
  TRACE_ENDING_FINAL = 2;
}

// CorrelatedPredicate tests one part of a transition for a model value of definition_id: any value,
// or exactly equals_text.
message CorrelatedPredicate {
  CorrelatedPredicateField field = 1;
  string definition_id = 2;
  oneof constraint {
    // Matches any value; must be true.
    bool present = 3;
    string equals_text = 4;
  }
}

// CorrelatedPredicateField names the part of a transition a predicate tests; FACT matches any of its
// facts.
enum CorrelatedPredicateField {
  CORRELATED_PREDICATE_FIELD_UNSPECIFIED = 0;
  CORRELATED_PREDICATE_FIELD_ACTION = 1;
  CORRELATED_PREDICATE_FIELD_OUTCOME = 2;
  CORRELATED_PREDICATE_FIELD_STATE = 3;
  CORRELATED_PREDICATE_FIELD_FACT = 4;
}

// CorrelatedCaptureDeclaration retains one declared evidence field of the operation's admitted steps.
// Occurrences are numbered from zero in admission order and never rewritten, so a correlation
// operand names an exact earlier occurrence rather than an implicit latest match. `lifetime` is how
// many occurrences one operation retains.
message CorrelatedCaptureDeclaration {
  string capture_id = 1;
  string field_id = 2;
  int64 lifetime = 3;
}

// CorrelatedCaptureRef reads one retained occurrence of a capture by its zero-based ordinal.
message CorrelatedCaptureRef {
  string capture_id = 1;
  int64 ordinal = 2;
}

// CorrelatedCorrelation decides whether a labeled transition is one of the operation's semantic steps.
// It never supplies a trigger or a response: the bounded countdown stays exactly the one the
// rule's trigger and response patterns describe. `all` and `any` are evaluated left to right and
// stop at the first decisive operand, so an operand an earlier one made irrelevant is never read.
message CorrelatedCorrelation {
  oneof condition {
    CorrelatedPredicate predicate = 1;
    CorrelatedComparison comparison = 2;
    CorrelatedCorrelationGroup all = 3;
    CorrelatedCorrelationGroup any = 4;
  }
}

// CorrelatedCorrelationGroup is the operand list of an all or any correlation.
message CorrelatedCorrelationGroup { repeated CorrelatedCorrelation operands = 1; }

// CorrelatedComparison compares two operands of one declared kind for equality.
message CorrelatedComparison {
  CorrelatedComparisonOperator operator = 1;
  CorrelatedOperand left = 2;
  CorrelatedOperand right = 3;
}

// CorrelatedComparisonOperator names the equality a correlated comparison tests.
enum CorrelatedComparisonOperator {
  CORRELATED_COMPARISON_OPERATOR_UNSPECIFIED = 0;
  CORRELATED_COMPARISON_OPERATOR_EQUAL = 1;
  CORRELATED_COMPARISON_OPERATOR_NOT_EQUAL = 2;
}

// CorrelatedOperand reads only declared evidence: an exact literal, one declared evidence field of the
// step being admitted, or one retained earlier occurrence of a declared capture.
message CorrelatedOperand {
  oneof operand {
    Value literal = 1;
    string field_id = 2;
    CorrelatedCaptureRef capture = 3;
  }
}

// CorrelatedLimits bound the evidence and obligations of one correlated contract.
message CorrelatedLimits {
  // Distinct evidence accepted; every ordinal is below it.
  int64 max_events = 1;
  // Evidence accepted but still waiting for its parents or its preceding ordinal.
  int64 max_buffered = 2;
  // Distinct operations.
  int64 max_keys = 3;
  // Supporting evidence identities retained.
  int64 max_support = 4;
  // Work projecting evidence into operation transitions.
  int64 max_projection_work = 5;
  // Size of one evidence value.
  int64 max_event_bytes = 6;
  // Operation transitions admitted.
  int64 max_semantic_transitions = 7;
  // Obligations triggered.
  int64 max_obligations = 8;
  // Work checking obligations.
  int64 max_obligation_work = 9;
  // A capability declaring captures or a correlation must set both ceilings; one that declares
  // neither leaves both unset and keeps its exact existing encoding.
  int64 max_captures = 10;
  // Nesting depth of the correlation condition, its root counting as 1.
  int64 max_correlation_depth = 11;
}

// CorrelatedEvidenceProjection is the Program-declared source of the CorrelatedEvidence a correlated capability
// reads. Its rules are tried in declaration order and the first whose guard resolves supplies the
// Observation; a projected value no rule claims emits nothing.
//
// A source ordinal is the position of the evidence in this source's own dense stream, so it is the
// count of values this lift has already emitted from the same projected list rather than anything
// read out of the value. The projector requires exactly that: independent sources have independent
// zero-based ordinals, and only the emitter can count them.
message CorrelatedEvidenceProjection {
  string observation_id = 1;
  repeated CorrelatedEvidenceRule rules = 2;
}

// CorrelatedEvidenceRule lifts one recorded fact into a CorrelatedEvidence value. `guard` selects the rule:
// it fires only where that path resolves and, when `guard_equals_text` is set, only where it reads
// exactly that text. So one rule per recorded kind selects itself and `kind` is the literal the
// selected shape denotes. Every path is read from the projected value; no Run field, wall clock or
// Driver state is reachable from here.
message CorrelatedEvidenceRule {
  repeated CorrelatedEvidenceBinding scope = 1;
  string evidence_source = 2;
  FieldPath operation = 3;
  string kind = 4;
  repeated CorrelatedEvidenceBinding fields = 5;
  FieldPath guard = 6;
  string guard_equals_text = 7;
}

// CorrelatedEvidenceBinding names one CorrelatedEvidence slot and what supplies it: a path read from the
// projected value, or a literal the Case declares. A Run coordinate that the recorded fact does not
// itself carry is declared, never invented from Driver state.
message CorrelatedEvidenceBinding {
  string field_id = 1;
  oneof value {
    FieldPath path = 2;
    string literal = 3;
  }
}

// CorrelatedEvidence is supplied only through the capability's declared typed Observation.
// Source ordinals and parents carry semantic order; Run elapsed time never supplies a tick.
message CorrelatedEvidence {
  CorrelatedIdentity identity = 1;
  // The key that groups this evidence into one operation.
  string operation = 2;
  // Selects the projection rule.
  string kind = 3;
  // Identities of causal parents in the same operation, released before this evidence.
  repeated CorrelatedIdentity parents = 4;
  repeated CorrelatedEvidenceField fields = 5;
}

// CorrelatedIdentity names one evidence value: its scope, its source, and its zero-based ordinal in
// that source's dense stream.
message CorrelatedIdentity {
  repeated CorrelatedBinding scope = 1;
  string evidence_source = 2;
  int64 ordinal = 3;
}

// CorrelatedBinding is one scope field and its non-empty text value.
message CorrelatedBinding { string field_id = 1; string value = 2; }

// CorrelatedEvidenceField is one evidence field and its text, natural or boolean value, unset when
// the field is redacted.
message CorrelatedEvidenceField { string field_id = 1; Value value = 2; }
