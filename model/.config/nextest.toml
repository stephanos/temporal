nextest-version = { required = "0.9.149" }

[test-groups]
# One test can launch two 512 MiB TLC recovery JVMs. Separate workspace runs
# must share the host budget; this group limits only this nextest invocation.
jvm = { max-threads = 1 }

[profile.default]
test-threads = "num-cpus"
slow-timeout = { period = "30s" }

[[profile.default.overrides]]
filter = 'package(=umpire-temporal-tests) & binary(=fixtures)'
test-group = "jvm"
