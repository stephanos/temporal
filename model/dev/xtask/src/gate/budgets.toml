# Reviewed per-stage budgets for the Temporal stages of the paired Model gate (fn-254 R8).
# The framework stages it delegates are budgeted by the framework's own table
# (umpire/tools/xtask/src/gate/budgets.toml). Every Temporal stage in mise.toml needs
# exactly one entry here; the gate refuses unbudgeted or unknown stages.
#
# Limits, tiers, the 25% tolerance, the one drained retry and the review rule follow the
# framework table and its README section "Stage budgets". Initial values (2026-11-03)
# derive from the fn-263 paired required run (TLC required, Apalache skipped): warm time
# is about 1.3-1.5x the observed run with a 20 s floor; the check tier has no measured
# paired run yet and reuses the validate value. Counts carry headroom for ordinary test
# additions. Changing an entry is a reviewed edit that updates `reason`.
version = 2
admitted = true
scope = "temporal"
# Bound on waiting for admission or for running stages to drain before a retry. It must be
# at least 2 x 1.25 x the slowest warm budget (temporal/tests, 1200 s): raise it together
# with that budget.
drain_seconds = 3000.0

# Paired tier totals are reported against fn-254 R6's model-check and model-validate targets.
[tiers.check]
target_seconds = 180.0

[tiers.validate]
target_seconds = 600.0

# Required by the shared schema. The paired quick command bridges to the framework quick,
# which reports its total against the framework table's quick target (R6's 60 s).
[tiers.quick]
target_seconds = 60.0

