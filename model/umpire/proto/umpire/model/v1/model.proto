syntax = "proto3";

package umpire.model.v1;
option go_package = "umpire.local/model/umpire/model/v1;modelv1";

import "google/protobuf/any.proto";

enum Method {
  METHOD_UNSPECIFIED = 0;
  METHOD_EXPLORE = 1;
  METHOD_ROWS = 2;
  METHOD_RESET = 3;
  METHOD_JUDGE = 4;
  METHOD_ANSWER = 5;
  METHOD_PROPOSE = 6;
  METHOD_ANNOTATE = 7;
}

enum RefusalCode {
  REFUSAL_CODE_UNSPECIFIED = 0;
  REFUSAL_CODE_UNKNOWN_METHOD = 1;
  REFUSAL_CODE_MALFORMED_REQUEST = 2;
  REFUSAL_CODE_BUDGET = 3;
  REFUSAL_CODE_STATE = 4;
  REFUSAL_CODE_NOT_EXPLORED = 5;
  REFUSAL_CODE_ALLOCATION = 6;
  REFUSAL_CODE_SCOPE_ACTION = 7;
  REFUSAL_CODE_UNSUPPORTED = 8;
  REFUSAL_CODE_QUIESCENT = 9;
}

message ExploreRequest { uint32 budget = 1; }
message ExploreResponse {
  string report = 1;
  uint32 starts = 2;
  uint32 reached = 3;
  uint32 emitted = 4;
  uint32 evaluated = 5;
  uint32 refused = 6;
  uint32 depth = 7;
  bool cut = 8;
}
message RowsRequest { uint32 state_id = 1; }
message RowsResponse { repeated string rows = 1; }
message Refusal {
  RefusalCode code = 1;
  string message = 2;
}

message ResetRequest { google.protobuf.Any configuration = 1; }
message ResetResponse {}
message JudgeRequest { google.protobuf.Any observation = 1; }
message Explanation {
  repeated string steps = 1;
  repeated string outcomes = 2;
}
message Unexplained { repeated string expected_actions = 1; }
message JudgeResponse {
  oneof judgment {
    Explanation explained = 1;
    Unexplained unexplained = 2;
  }
  bool continue_polling = 3;
}
message AnswerRequest { google.protobuf.Any callback = 1; }
message AnswerResponse { google.protobuf.Any reply = 1; }
enum ProposalKind {
  PROPOSAL_KIND_UNSPECIFIED = 0;
  PROPOSAL_KIND_ACTION = 1;
  PROPOSAL_KIND_BOOTSTRAP = 2;
}
message ProposeRequest { uint64 seed = 1; }
message ProposeResponse {
  google.protobuf.Any request = 1;
  string action = 2;
  ProposalKind kind = 3;
}
message AnnotateRequest { google.protobuf.Any input = 1; }
message AnnotateResponse { google.protobuf.Any output = 1; }

message Response {
  reserved 7;
  oneof outcome {
    ExploreResponse explore = 1;
    RowsResponse rows = 2;
    Refusal refusal = 3;
    ResetResponse reset = 4;
    JudgeResponse judge = 5;
    AnswerResponse answer = 6;
    AnnotateResponse annotate = 8;
    ProposeResponse propose = 9;
  }
}
