# The sole framework stage graph. Native xtask admits callers, owns process cleanup
# and records receipts; these dependencies own scheduling. No task result caching.
["gate:all"]
description = "Admitted framework gate, including the required standalone control"
depends = ["gate:standalone"]

["gate:child"]
description = "Complete framework gate without recursive standalone copying"
depends = ["gate:retired-names", "gate:fmt", "gate:kettle-go-host"]

["gate:proto-tools"]
env.UMPIRE_GATE_STAGE = "proto-tools"
env.UMPIRE_GATE_ORDER = "0"
dir = "{{env.UMPIRE_FRAMEWORK_ROOT}}"
env.UMPIRE_TOOL_ROOT = "{{env.UMPIRE_FRAMEWORK_ROOT}}"
env.UMPIRE_GATE_SCOPE = "framework"
run = 'exec "$UMPIRE_GATE_EXECUTABLE" gate --scheduled-stage proto-tools'

["gate:retired-names"]
env.UMPIRE_GATE_STAGE = "retired-names"
env.UMPIRE_GATE_ORDER = "1"
dir = "{{env.UMPIRE_FRAMEWORK_ROOT}}"
