syntax = "proto3";

package umpire.annotations.v1;

option go_package = "umpire.local/model/gen/umpire/annotations/v1";


message AnnotationRequest {
  string method = 1;
  bool response = 2;
  bytes message = 3;
  uint64 seed = 4;
}

message AnnotationResponse {
  bytes message = 1;
  repeated string violations = 2;
  string out_of_scope = 3;
}

message ProbeCase {
  string id = 1;
  string method = 2;
  // Consumer-owned setup prerequisite.
  string prerequisite = 3;
  bool accepts = 4;
  int32 code = 5;
  string message_pattern = 6;
  string details_type = 7;
  reserved 8;
  reserved "covers";
  bool generic = 9;
  string refusal = 10;
  repeated ProbeExpectation predictions = 11;
  ProbeApplicability applicability = 12;
}

enum ProbeApplicability {
  APPLICABLE = 0;
  NOT_APPLICABLE = 1;
  REFUSED = 2;
  UNCHANGED = 3;
}

message ProbeExpectation {
  string id = 1;
  bool accepts = 2;
  int32 code = 3;
  string message_pattern = 4;
  string details_type = 5;
}

message ProbeObservation {
  string case_id = 1;
  bool accepted = 2;
  int32 code = 3;
  bool message_matches = 4;
  string details_type = 5;
  repeated ProbeMatch predictions = 6;
  uint32 prediction_count = 7;
  ProbeApplicability applicability = 8;
  string refusal = 9;
}

message ProbeMatch {
  uint32 index = 1;
  string prediction_id = 2;
  bool message_matches = 3;
  string details_type = 4;
}

message ProbeSegment {
  bytes literal = 1;
  uint32 repeat = 2;
}

message ProbeRecipe {
  repeated ProbeSegment segments = 1;
  uint32 decoded_length = 2;
  // FNV-1a 64 detects accidental byte corruption, not malicious modification.
  uint64 fnv64 = 3;
}

message ProbeResponse {
  repeated ProbeCase cases = 1;
  string method = 2;
  bytes message = 3;
  ProbeRecipe recipe = 4;
  string report = 5;
  bool fails = 6;
}
