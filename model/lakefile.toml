name = "temporal-model"
defaultTargets = ["NexusAutoClose", "Temporal", "Umpire", "UmpireTests", "TemporalUmpireTests", "ExperimentTests", "temporal-umpire-inspect", "temporal-experiment-inspect"]

[[lean_lib]]
name = "NexusAutoClose"

[[lean_lib]]
name = "Temporal"

[[lean_lib]]
name = "Umpire"

[[lean_lib]]
name = "UmpireTests"
roots = ["UmpireTests"]

[[lean_lib]]
name = "TemporalUmpireTests"
roots = ["TemporalUmpireTests"]

[[lean_lib]]
name = "ExperimentTests"
roots = ["Temporal.ExperimentTests"]

[[lean_exe]]
name = "temporal-umpire-inspect"
root = "Temporal.Umpire.Inspect"

[[lean_exe]]
name = "temporal-experiment-inspect"
root = "Temporal.Experiment.Inspect"
