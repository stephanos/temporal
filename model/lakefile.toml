name = "temporal-model"
defaultTargets = ["Shared", "Temporal", "Umpire", "UmpireTests", "TemporalModelTests", "temporal-model-inspect"]
builtinLint = true
lintDriver = "modelLint"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Shared"

[[lean_lib]]
name = "Temporal"

[[lean_lib]]
name = "Umpire"

[[lean_lib]]
name = "UmpireTests"
roots = ["UmpireTests"]

[[lean_lib]]
name = "TemporalModelTests"
roots = ["TemporalModelTests"]

[[lean_lib]]
name = "ModelLintSupport"
roots = ["ModelLint.ImportGraph", "ModelLint.Inventory"]

[[lean_exe]]
name = "temporal-model-inspect"
root = "Temporal.Tool.Inspect"

[[lean_exe]]
name = "modelLint"
root = "ModelLint"
supportInterpreter = true

[[lean_exe]]
name = "modelLintTests"
root = "ModelLint.ImportGraphTests"
supportInterpreter = true
