name = "temporal-model"
defaultTargets = ["Shared", "Temporal", "Umpire", "UmpireTests", "TemporalModelTests", "TemporalExperimentalTests", "temporal-model-inspect", "temporal-case-runtime"]
builtinLint = true
lintDriver = "modelLint"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Shared"

[[lean_lib]]
name = "Temporal"

[[lean_lib]]
name = "Umpire"

[[lean_lib]]
name = "UmpireTests"
roots = ["UmpireTests"]

[[lean_lib]]
name = "TemporalModelTests"
roots = ["TemporalModelTests"]

[[lean_lib]]
name = "TemporalExperimentalTests"
roots = ["TemporalExperimentalTests"]

[[lean_lib]]
name = "ModelLintSupport"
roots = ["Tools.LeanImportGraph", "Tools.LeanImportGraphTests", "Tools.LeanSourceInventory", "Tools.LeanSourceInventoryTests", "ModelLint.ImportGraph"]

[[lean_exe]]
name = "temporal-model-inspect"
root = "Temporal.Tool.Inspect"

[[lean_exe]]
name = "temporal-model-semantic-inventory"
root = "Temporal.Tool.SemanticInventoryMain"

[[lean_exe]]
name = "temporal-model-semantic-inventory-tests"
root = "Temporal.Tool.SemanticInventoryMainTests"

[[lean_exe]]
name = "temporal-model-semantic-inventory-make-tests"
root = "Temporal.Tool.SemanticInventoryMakeTestsMain"

[[lean_exe]]
name = "temporal-case-runtime"
root = "Temporal.Tool.CaseRuntime"

[[lean_exe]]
name = "modelLint"
root = "ModelLint"
supportInterpreter = true

[[lean_exe]]
name = "modelLintTests"
root = "ModelLint.ImportGraphTests"
supportInterpreter = true
