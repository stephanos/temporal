syntax = "proto3";

package umpire.temporal.v1;

option go_package = "umpire.local/temporal/umpire/temporal/v1";

import public "umpire/temporal/v1/probe.proto";

import "google/protobuf/any.proto";

// Read an in-flight activity. Answer replies are sent separately and never resent.
message ObserveActivity {
  google.protobuf.Any request = 1;
  uint64 poll_interval_ms = 2;
  uint64 read_timeout_ms = 3;
  uint64 backoff_ms = 4;
}
