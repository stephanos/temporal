syntax = "proto3";

package umpire.temporal.v1;

option go_package = "umpire.local/temporal/umpire/temporal/v1";

import "google/protobuf/any.proto";
import public "umpire/temporal/v1/probe.proto";

message Observation {
  string method = 1;
  oneof result {
    google.protobuf.Any response = 2;
    Error error = 3;
  }
}

message Error {
  int32 code = 1;
  string message = 2;
}

message Callback {
  google.protobuf.Any task = 1;
}

message Reply {
  google.protobuf.Any request = 1;
}

message AnnotationRequest {
  string method = 1;
  bool response = 2;
  bytes message = 3;
  uint64 seed = 4;
}

message AnnotationResponse {
  bytes message = 1;
  repeated string violations = 2;
  string out_of_scope = 3;
}
