syntax = "proto3";

package umpire.temporal.v1;

option go_package = "umpire.local/temporal/umpire/temporal/v1";

import public "umpire/temporal/v1/probe.proto";
import public "umpire/temporal/v1/activity.proto";

import "google/protobuf/any.proto";

// A worker matches rules in order using feature-specific keys. Activity scenarios are
// carried in the task header named "umpire-scenario", outside application input.
message WorkerProgram {
  string namespace = 1;
  string task_queue = 2;
  repeated Rule rules = 3;
}

message Rule {
  google.protobuf.Any key = 1;
  repeated google.protobuf.Any respond = 2;
}

// Hold worker polls until the enclosed request has been acknowledged.
message TemporalInstruction {
  google.protobuf.Any request = 1;
  bool hold_worker_polls = 2;
}
