# Formatting for the Scala model. Run through `make fmt-model`; `make lint-model` checks it.
version = 3.11.5
runner.dialect = scala3
maxColumn = 100
project.git = false
project.excludePaths = ["glob:**/build/**", "glob:**/.scala-build/**", "glob:**/.bsp/**"]

rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle

# A blank line before each object, at any depth, and around multi-line top-level declarations.
newlines.topLevelStatementBlankLines = [
  { regex = "^Defn\\.Object$", minBreaks = 0, blanks { before = 1 } }
  { maxNest = 0, blanks { before = 1, after = 1 } }
]
# Lifter fixtures assert refusals at their lines; keep their layout.
fileOverride {
  "glob:**/irgen/testdata/**" {
    newlines.topLevelStatementBlankLines = []
  }
}
