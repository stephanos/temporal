# Formatting for the Scala model. Run through `make fmt-model`; `make lint-model` checks it.
version = 3.11.5
runner.dialect = scala3
maxColumn = 100
project.git = false
project.excludePaths = [
  "glob:**/gen/**", "glob:**/.scala-build/**", "glob:**/.bsp/**",
  # Reformatting these fixtures rewraps lines above declarations whose lines their expected IR and
  # refusals record, so it would move recorded positions. Admission and CloseReset are also the
  # specimens' reviewed blocks, lifted as written.
  "glob:**/lifter/testdata/lifts/Admission.scala", "glob:**/lifter/testdata/lifts/Channels.scala",
  "glob:**/lifter/testdata/lifts/CloseReset.scala", "glob:**/lifter/testdata/lifts/Realizations.scala",
  "glob:**/lifter/testdata/lifts/Rejects.scala"
]

rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers, Imports]
rewrite.imports.sort = scalastyle
docstrings.style = Asterisk
docstrings.wrap = no
