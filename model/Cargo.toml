# model: the Umpire framework in Rust. Current scope: what model/archived/framework/samples/Kettle.scala
# uses today. Shared Models and their end-to-end goldens live in umpire/tests.
[workspace]
resolver = "3"
members = [
    "umpire/annotations",
    "umpire/catalog",
    "umpire/catalog/macros",
    "umpire/catalog/syntax",
    "umpire/catalog-build",
    "umpire/dsl",
    "umpire/dsl/macros",
    "umpire/checker",
    "umpire/tests",
    "umpire/testing",
    "umpire/suite",
    "umpire/ir",
    "umpire/ir-derive",
    "umpire/front",
    "umpire/lift",
    "umpire/backends/tlc",
    "umpire/backends/apalache",
    "umpire/reference/kettle",
    "umpire/reference/kettle/guest",
    "umpire/wasm",
    "umpire/wasm/guests/stock",
    "umpire/wasm/guests/control",
    "umpire/wasm/guests/caught-panic",
    "umpire/wasm/guests/overflow",
    "temporal/api",
    "temporal/annotate",
    "temporal/annotate/macros",
    "temporal/annotate/syntax",
    "temporal/realization",
    "temporal/realization/macros",
    "temporal/guest",
    "temporal/testing",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
umpire-reference-kettle = { version = "0.0.1", path = "umpire/reference/kettle" }
umpire-catalog = { version = "0.0.1", path = "umpire/catalog" }
umpire-catalog-macros = { version = "0.0.1", path = "umpire/catalog/macros" }
umpire-catalog-syntax = { version = "0.0.1", path = "umpire/catalog/syntax" }
umpire-catalog-build = { version = "0.0.1", path = "umpire/catalog-build" }
umpire-annotations = { version = "0.0.1", path = "umpire/annotations" }
umpire-dsl = { version = "0.0.1", path = "umpire/dsl" }
umpire-dsl-macros = { version = "0.0.1", path = "umpire/dsl/macros" }
umpire-checker = { version = "0.0.1", path = "umpire/checker" }
umpire-testing = { version = "0.0.1", path = "umpire/testing" }
umpire-suite = { version = "0.0.1", path = "umpire/suite" }
umpire-ir-derive = { version = "0.0.1", path = "umpire/ir-derive" }
umpire-ir = { version = "0.0.1", path = "umpire/ir" }
umpire-front = { version = "0.0.1", path = "umpire/front" }
umpire-lift = { version = "0.0.1", path = "umpire/lift" }
umpire-apalache = { version = "0.0.1", path = "umpire/backends/apalache" }
umpire-tlc = { version = "0.0.1", path = "umpire/backends/tlc" }
umpire-wasm = { version = "0.0.1", path = "umpire/wasm" }
umpire-temporal-api = { version = "0.0.1", path = "temporal/api" }
umpire-temporal-annotate = { version = "0.0.1", path = "temporal/annotate" }
umpire-temporal-annotate-macros = { version = "0.0.1", path = "temporal/annotate/macros" }
umpire-temporal-annotate-syntax = { version = "0.0.1", path = "temporal/annotate/syntax" }
umpire-temporal = { version = "0.0.1", path = "temporal/realization" }
umpire-temporal-realization-macros = { version = "0.0.1", path = "temporal/realization/macros" }

# Admitted dependencies (fn-210 R18). Declared once here; a crate opts in with `name.workspace = true`.
indexmap = "2.14"
rustc-hash = "2.1"
smallvec = { version = "1.16", features = ["union", "const_generics"] }
petgraph = { version = "0.8", default-features = false, features = ["graphmap", "stable_graph"] }
fixedbitset = "0.5"
enum-iterator = "2.3"
imbl = "7.0"
thiserror = "2.0"
# Already resolved by trybuild; strict backend wire decoding uses its duplicate-key visitor.
serde = "1.0"
serde_json = "1.0"
# the host interface (fn-210 R31): protobuf messages, generated from umpire/proto with the mise protoc
prost = "0.14"
prost-build = "0.14"
# proc macros
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
manyhow = "0.14"
prettyplease = "0.3"
# tests
insta = "1.49"
trybuild = "1.0"
proptest = "1.12"

# One lint policy for every crate; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints that fight the Model-authoring style
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# correctness and footguns we want hard
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true  # fn-210 R11: same arithmetic answer in every profile
debug = 1          # symbols for profiling the checker
lto = "thin"
codegen-units = 1

[profile.guest]
inherits = "release"
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "unwind"
