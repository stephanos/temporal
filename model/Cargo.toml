# model: the Umpire framework in Rust. Current scope: what model/archived/framework/samples/Kettle.scala
# uses today. Shared Models and their end-to-end goldens live in umpire/dev/fixtures.
[workspace]
resolver = "3"
members = [
    "dev/xtask",
    "umpire/author/umpire",
    "umpire/author/umpire/tests/consumer",
    "umpire/author/dsl",
    "umpire/author/dsl/macros",
    "umpire/author/suite",
    "umpire/front",
    "umpire/ir",
    "umpire/ir/derive",
    "umpire/backends/native",
    "umpire/backends/process",
    "umpire/backends/tla",
    "umpire/backends/tlc",
    "umpire/backends/apalache",
    "umpire/protocol/runtime",
    "umpire/protocol/runtime/guests/stock",
    "umpire/protocol/runtime/guests/control",
    "umpire/protocol/runtime/guests/caught-panic",
    "umpire/protocol/runtime/guests/overflow",
    "umpire/catalog",
    "umpire/catalog/syntax",
    "umpire/catalog/macros",
    "umpire/catalog/build",
    "umpire/reference/kettle",
    "umpire/reference/kettle/guest",
    "umpire/dev/testing",
    "umpire/dev/fixtures",
    "temporal/api",
    "temporal/annotate/syntax",
    "temporal/realization",
    "temporal/realization/macros",
    "temporal/guest",
    "temporal/testing",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
umpire = { version = "0.0.1", path = "umpire/author/umpire" }
umpire-reference-kettle = { version = "0.0.1", path = "umpire/reference/kettle" }
umpire-catalog = { version = "0.0.1", path = "umpire/catalog" }
umpire-catalog-macros = { version = "0.0.1", path = "umpire/catalog/macros" }
umpire-catalog-syntax = { version = "0.0.1", path = "umpire/catalog/syntax" }
umpire-catalog-build = { version = "0.0.1", path = "umpire/catalog/build" }
umpire-dsl = { version = "0.0.1", path = "umpire/author/dsl" }
umpire-dsl-macros = { version = "0.0.1", path = "umpire/author/dsl/macros" }
umpire-checker = { version = "0.0.1", path = "umpire/backends/native" }
umpire-testing = { version = "0.0.1", path = "umpire/dev/testing" }
umpire-suite = { version = "0.0.1", path = "umpire/author/suite" }
umpire-ir-derive = { version = "0.0.1", path = "umpire/ir/derive" }
umpire-ir = { version = "0.0.1", path = "umpire/ir" }
umpire-front = { version = "0.0.1", path = "umpire/front" }
umpire-backend-process = { version = "0.0.1", path = "umpire/backends/process" }
umpire-tla = { version = "0.0.1", path = "umpire/backends/tla" }
umpire-apalache = { version = "0.0.1", path = "umpire/backends/apalache" }
umpire-tlc = { version = "0.0.1", path = "umpire/backends/tlc" }
umpire-runtime = { version = "0.0.1", path = "umpire/protocol/runtime" }
umpire-temporal-api = { version = "0.0.1", path = "temporal/api" }
umpire-temporal-annotate-syntax = { version = "0.0.1", path = "temporal/annotate/syntax" }
umpire-temporal = { version = "0.0.1", path = "temporal/realization" }
umpire-temporal-realization-macros = { version = "0.0.1", path = "temporal/realization/macros" }

# Admitted dependencies (fn-210 R18). Declared once here; a crate opts in with `name.workspace = true`.
indexmap = "2.14"
rustc-hash = "2.1"
smallvec = { version = "1.16", features = ["union", "const_generics"] }
petgraph = { version = "0.8", default-features = false, features = ["graphmap", "stable_graph"] }
fixedbitset = "0.5"
imbl = "7.0"
thiserror = "2.0"
libc = "=0.2.191"
rustix = { version = "=1.1.5", features = ["process"] }
tempfile = "=3.27.0"
# Already resolved by trybuild; strict backend wire decoding uses its duplicate-key visitor.
serde = "1.0"
serde_json = "1.0"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
sha2 = "0.11"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# the host interface (fn-210 R31): protobuf messages, generated from umpire/protocol/proto with the mise protoc
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
# proc macros
heck = "0.5"
darling = { version = "0.24.1", default-features = false }
proc-macro-crate = "3.5.0"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
manyhow = "0.14"
prettyplease = "0.3"
# tests
insta = "1.49"
trybuild = "1.0"
proptest = "1.12"

# One lint policy for every crate; each crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic lints that fight the Model-authoring style
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# correctness and footguns we want hard
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
overflow-checks = true

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
overflow-checks = true  # fn-210 R11: same arithmetic answer in every profile
debug = 1          # symbols for profiling the checker
lto = "thin"
codegen-units = 1

[profile.guest]
inherits = "release"
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "unwind"
