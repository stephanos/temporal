# Lint rules for the Scala model. `make lint-model` checks them; `make fix-model` applies the rewrites.
# RemoveUnused relies on the compiler's -Wunused warnings, which the Makefile passes.
rules = [
  DisableSyntax,
  LeakingImplicitClassVal,
  NoValInForComprehension,
  RedundantSyntax,
  RemoveUnused,
]

DisableSyntax {
  noVars = true
  noThrows = false
  noNulls = true
  noReturns = true
  noWhileLoops = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noXml = true
  noFinalize = true
  noValPatterns = true
  noUniversalEquality = false
}

RemoveUnused {
  imports = true
  privates = true
  locals = true
  patternvars = true
  params = false
}
