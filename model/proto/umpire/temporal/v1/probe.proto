syntax = "proto3";

package umpire.temporal.v1;

option go_package = "umpire.local/temporal/umpire/temporal/v1";

import "umpire/annotations/v1/annotations.proto";

// Stateless activity probe operations carried by the existing Annotate Any.
message ProbeRequest {
  enum Operation { INVENTORY = 0; PREPARE = 1; CLASSIFY = 2; }
  Operation operation = 1;
  string case_id = 2;
  bool baseline = 3;
  string namespace = 4;
  string activity_id = 5;
  string task_queue = 6;
  string run_id = 7;
  bytes task_token = 8;
  repeated umpire.annotations.v1.ProbeObservation observations = 9;
  reserved 10, 11;
  reserved "uncovered_validators", "unresolved_validators";
}
