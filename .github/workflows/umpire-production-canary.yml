name: Umpire production canary

# A manual, protected run of the production canary. Only the production-canary environment holds
# the credential and the target's names, and only its protection (deployment branches limited to
# main, required reviewers) decides who receives them; the checks here are defense in depth, and
# the canary's preflight checks the ref, the event and this file again. See tools/canary/README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umpire-production-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-canary
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: false
          cache: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.8.16"
          sha256: "cff4832ded79af2951e800bddcb5a22acac58630d765a2d062c1180680a0bb35"
          cache: false
      - name: Build the canary
        run: make canary-build
      - name: Run the canary
        env:
          UMPIRE_CANARY_TLS_CERT: ${{ secrets.UMPIRE_CANARY_TLS_CERT }}
          UMPIRE_CANARY_TLS_KEY: ${{ secrets.UMPIRE_CANARY_TLS_KEY }}
          UMPIRE_CANARY_API_KEY: ${{ secrets.UMPIRE_CANARY_API_KEY }}
          UMPIRE_CANARY_GRPC: ${{ secrets.UMPIRE_CANARY_GRPC }}
          UMPIRE_CANARY_NAMESPACE: ${{ secrets.UMPIRE_CANARY_NAMESPACE }}
          UMPIRE_CANARY_TASK_QUEUE: ${{ secrets.UMPIRE_CANARY_TASK_QUEUE }}
          UMPIRE_CANARY_HANDLER_QUEUE: ${{ secrets.UMPIRE_CANARY_HANDLER_QUEUE }}
          UMPIRE_CANARY_ENDPOINT: ${{ secrets.UMPIRE_CANARY_ENDPOINT }}
        run: |
          mkdir -p canary-output
          ./.build/umpire-canary run --output canary-output --recovery "$RUNNER_TEMP/umpire-canary-recovery.json" > canary-output/run-summary.json 2> canary-output/run-progress.log
      - name: Reconcile
        if: always()
        env:
          UMPIRE_CANARY_TLS_CERT: ${{ secrets.UMPIRE_CANARY_TLS_CERT }}
          UMPIRE_CANARY_TLS_KEY: ${{ secrets.UMPIRE_CANARY_TLS_KEY }}
          UMPIRE_CANARY_API_KEY: ${{ secrets.UMPIRE_CANARY_API_KEY }}
          UMPIRE_CANARY_GRPC: ${{ secrets.UMPIRE_CANARY_GRPC }}
          UMPIRE_CANARY_NAMESPACE: ${{ secrets.UMPIRE_CANARY_NAMESPACE }}
          UMPIRE_CANARY_TASK_QUEUE: ${{ secrets.UMPIRE_CANARY_TASK_QUEUE }}
          UMPIRE_CANARY_HANDLER_QUEUE: ${{ secrets.UMPIRE_CANARY_HANDLER_QUEUE }}
          UMPIRE_CANARY_ENDPOINT: ${{ secrets.UMPIRE_CANARY_ENDPOINT }}
        run: |
          mkdir -p canary-output
          ./.build/umpire-canary reconcile --output canary-output --recovery "$RUNNER_TEMP/umpire-canary-recovery.json" > canary-output/reconcile-summary.json 2> canary-output/reconcile-progress.log
      - name: Upload the receipts, provenance, summaries and progress
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: umpire-production-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-output/
          if-no-files-found: warn
