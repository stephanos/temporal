name: Umpire

on:
  pull_request:
  push:
    branches:
      - main
      - stephanos/umpire

permissions:
  contents: read

concurrency:
  group: umpire-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  framework:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.10.11"
          sha256: "f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607"
          cache: false
          working_directory: model/umpire
      - name: Run the independent framework gate
        working-directory: model/umpire
        run: mise exec -- cargo xtask gate
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.10.11"
          sha256: "f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607"
          cache: false
      - name: Run the combined Model gate
        run: make model-check
  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: false
          cache: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.10.11"
          sha256: "f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607"
          cache: false
      - name: Run package-local Testpilot and Umpire tests
        run: mise exec -- go test -count=1 -tags test_dep ./tools/umpire/cmd/umpire ./tools/umpire/temporaldriver ./common/testing/testpilot/...
      - name: Run the live Umpire tests
        run: make umpire-check-live-tests
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: false
          cache: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.10.11"
          sha256: "f9612efcddda0ae55b62d3b6f82a6c860d5b54ebee0807d4f1a1d578055e1607"
          cache: false
      - name: Run the canary's unit tests
        run: mise exec -- go test -count=1 -tags test_dep ./tools/canary/...
      - name: Run the canary harness build's tests
        run: mise exec -- go test -count=1 -tags 'test_dep canary_harness' ./tools/canary/testharness/
      - name: Build the production canary
        run: make canary-build
