name: Umpire

on:
  pull_request:
  push:
    branches:
      - main
      - stephanos/umpire

permissions:
  contents: read

concurrency:
  group: umpire-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: false
          cache: false
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          version: "2026.8.16"
          sha256: "cff4832ded79af2951e800bddcb5a22acac58630d765a2d062c1180680a0bb35"
          working_directory: model
          cache: false
      - name: Run the ordinary Umpire test
        run: mise exec -- go test -count=1 -tags test_dep ./tools/umpire/temporal/nexus/... -run '^TestHermeticCIPortability$'
