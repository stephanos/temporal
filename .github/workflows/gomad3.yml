name: Gomad v3

on:
  pull_request:
    paths:
      - ".github/workflows/gomad3.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad3/**"
      - "tools/gomad3integration/**"
      - "tools/gomad3sim/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gomad3.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad3/**"
      - "tools/gomad3integration/**"
      - "tools/gomad3sim/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: gomad3-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  host-tools-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: false
          cache: true

      - name: Validate generated outputs, patches, scripts, compatibility packs, and the ./tests qualification manifest
        working-directory: tools/gomad3
        run: make validate

      - name: Test platform-neutral host tooling
        working-directory: tools/gomad3
        run: >-
          go test -count=1 -tags test_dep
          ./internal/hostexec
          ./internal/hostfs
          ./internal/gomadtool/...
          ./cmd/gomadtool

  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: false
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64

      - name: Build the toolchain and run the conformance tiers qualified on Linux
        run: >-
          make -C tools/gomad3 test-harness test-toolchain intercept-test overlay-test test-simulation
          world-test test-builder test-live-capability test-upstream test-runtime

      - name: Run the host tier
        run: make -C tools/gomad3 test-host

      - name: Qualify the Linux compatibility packs and the core corpus
        run: make -C tools/gomad3 compatibility-pack-qualification core-qualification-set

      - name: Verify portable core qualification evidence
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .platform == {"goos": "linux", "goarch": "amd64"} and
          .seeds == ["17"] and .expectations_met and
          .selected == 7 and .completed == 7 and .supported == 7 and
          .unsupported == 0 and .failed == 0 and .infrastructure_errors == 0 and
          ([.workloads[] | select(.classification == "qualified") | .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/core-qualification-set.json

      - name: Upload core qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-linux-qualification-${{ github.run_id }}
          path: |
            tools/gomad3/.toolchain/core-qualification-set.json
            tools/gomad3/.toolchain/core-qualification
          if-no-files-found: error
          retention-days: 90

      # The functional test package's capability closure is closed on Linux under
      # the gomad build tag (MILESTONES.md F4): build seams cut the server's
      # host-only providers and the fx, SDK, otel, and gRPC adapters remove the
      # remaining forbidden imports, so closure mode reports zero blockers.
      - name: Close the functional test capability closure
        run: >-
          make gomad3-runner &&
          tools/gomad3/.bin/gomad analyze --capability-mode=closure --format=json --timeout=15m
          --build-tag disable_grpc_modules --build-tag gomad --build-tag test_dep
          go-test ./tests > tools/gomad3/.toolchain/tests-closure.json;
          jq -e '
          .classification == "supported" and (.blockers | length) == 0 and
          ([.packs[].id] | index("temporal-functional-tests-linux-amd64") != null)
          ' tools/gomad3/.toolchain/tests-closure.json

      # The Temporal corpus on Linux: the ten expected boundaries hold (the amd64
      # xxhash assembly, which the darwin-scoped temporal-leaf packs do not
      # admit), and the other eighteen workloads are supported. The five package
      # suites, the tier 3 user-timers and activity batch cancel suites, and the
      # ten `functional-*` suites of the F6 slice qualify with exact replay on
      # both seeds. The tier 3 probe runs to a successful exit under guarded
      # mode, but one run's seed 17 did not reproduce its evidence, so
      # temporal.json states its linux/amd64 expectation as `intermittent` until
      # MILESTONES.md F3 closes it. Since the FIPS DRBG and mark-start
      # greying runtime changes, seed 17 of one functional suite per run has
      # diverged on replay, a different suite each time, so the F5 and F6
      # suites are `intermittent` on linux under the F7 finding too.
      - name: Requalify representative Temporal workloads
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: make gomad3-qualification

      - name: Verify portable Temporal qualification evidence
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .platform == {"goos": "linux", "goarch": "amd64"} and
          .seeds == ["11", "17"] and .expectations_met and
          .selected == 28 and .completed == 28 and .unsupported == 10 and
          (.supported + .failed) == 18 and
          .infrastructure_errors == 0 and
          ([.workloads[] | select(.id == "frontend-system-info" or .id == "user-timers-workflow" or .id == "activity-batch-cancel-boundary" or (.id | startswith("functional-"))) | .classification == "qualified" or .classification == "nondeterministic" or .classification == "replay_divergence"] | all) and
          ([.workloads[] | select(.classification == "qualified") |
          (.seeds | length) == 2 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/temporal-qualification-set.json

      - name: Upload Temporal qualification
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-linux-temporal-qualification-${{ github.run_id }}
          path: tools/gomad3/.toolchain/temporal-qualification-set.json
          if-no-files-found: error
          retention-days: 90

  core:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Produce checked upgrade qualification dossier
        env:
          GOMAD3_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          GOMAD3_APPROVED_BOUNDARY_DIFF_SHA256: ${{ vars.GOMAD3_APPROVED_BOUNDARY_DIFF_SHA256 }}
        run: make -C tools/gomad3 upgrade-dossier

      - name: Run the simulation tier
        run: make -C tools/gomad3 test-simulation

      - name: Verify portable core qualification evidence
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .seeds == ["17"] and
          .selected == 7 and .completed == 7 and .supported == 7 and
          .unsupported == 0 and .failed == 0 and .infrastructure_errors == 0 and
          ([.workloads[] | .classification == "qualified" and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/core-qualification-set.json

      - name: Upload upgrade qualification dossier
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-qualification-${{ github.run_id }}
          path: |
            tools/gomad3/.toolchain/upgrade-dossier.json
            tools/gomad3/.toolchain/core-qualification-set.json
            tools/gomad3/.toolchain/core-qualification
          if-no-files-found: error
          retention-days: 90

      # The darwin/arm64 counterpart of the Linux closure step (MILESTONES.md
      # F4 states its acceptance on darwin/arm64): the arm64 assembly and the
      # Prometheus client's darwin process-collector imports are admitted by
      # the darwin packs, so closure mode reports zero blockers.
      - name: Close the functional test capability closure
        run: >-
          make gomad3-runner &&
          tools/gomad3/.bin/gomad analyze --capability-mode=closure --format=json --timeout=15m
          --build-tag disable_grpc_modules --build-tag gomad --build-tag test_dep
          go-test ./tests > tools/gomad3/.toolchain/tests-closure.json;
          jq -e '
          .classification == "supported" and (.blockers | length) == 0 and
          ([.packs[].id] | index("temporal-functional-tests-darwin-arm64") != null)
          ' tools/gomad3/.toolchain/tests-closure.json

  functional-smoke:
    uses: ./.github/workflows/gomad3-smoke.yml

  temporal-integration:
    needs: core
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: true
          cache: true

      - name: Test Temporal wrapper contract
        run: make gomad3-integration-test

      - name: Requalify representative Temporal workloads
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: make gomad3-qualification

      # The tier 3 classifications are asserted through the manifest's
      # expectations, so this job goes red the moment a real darwin result
      # disagrees with what temporal.json states. On darwin the tier 3 frontend
      # probe is `qualified` with exact replay, every tier 2 package suite
      # qualifies (nine under the gomad tag, through the temporal-leaf packs),
      # and the tier 3 user-timers and activity batch cancel suites are
      # `qualified` with exact replay on both seeds since the mark-start
      # greying fix MILESTONES.md F5 records, as are the ten
      # `functional-*` suites of the F6 slice, so all 28 are supported.
      - name: Verify portable Temporal qualification evidence
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .platform == {"goos": "darwin", "goarch": "arm64"} and
          .seeds == ["11", "17"] and .expectations_met and
          .selected == 28 and .completed == 28 and .unsupported == 0 and
          .supported == 28 and .failed == 0 and
          .infrastructure_errors == 0 and
          ([.workloads[] | select(.tier == 2 and .classification == "qualified")] | length) == 15 and
          ([.workloads[] | select(.tier == 3 and .classification == "qualified")] | length) == 13 and
          ([.workloads[] | select(.classification == "qualified") |
          (.seeds | length) == 2 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/temporal-qualification-set.json

      - name: Upload Temporal qualification
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-temporal-qualification-${{ github.run_id }}
          path: |
            tools/gomad3/.toolchain/temporal-qualification-set.json
            tools/gomad3/.toolchain/temporal-qualification
          if-no-files-found: error
          retention-days: 90

  # The scheduled determinism soak (fn-112 R6, MILESTONES.md Q6). Each job runs
  # one workload and seed of tools/gomad3integration/qualification/soak.json:
  # N fresh same-seed repetitions in gomad qualify batches of 32, under two busy
  # host threads, with choice tracing and diagnostics on. Every batch is
  # compared with its cohort's baseline (workload, seed, platform, execution
  # identity), carried between runs in a ledger restored from the latest
  # retained scheduled or dispatched run; a new toolchain identity starts a new
  # cohort. The darwin gate accepts zero divergences, and an overflow, target
  # failure, or infrastructure failure fails it separately. A divergence
  # uploads both diagnostic traces and the differ output.
  determinism-soak-darwin:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        workload: [functional-activity, functional-child-workflow, functional-update, user-timers-workflow, frontend-system-info]
        seed: [11, 17]
    env:
      GOMAD3_SOAK_LEDGER_ARTIFACT: gomad3-soak-ledger-darwin-arm64-${{ matrix.workload }}-${{ matrix.seed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Restore the soak ledger from the latest retained run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ledger=tools/gomad3/.toolchain/soak/ledger
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow gomad3.yml --branch "$GITHUB_REF_NAME" --limit 50 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            test "$run" = "$GITHUB_RUN_ID" && continue
            rm -rf "$ledger"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$GOMAD3_SOAK_LEDGER_ARTIFACT" --dir "$ledger"; then
              echo "Restored the soak ledger from run $run"
              exit 0
            fi
          done
          rm -rf "$ledger"
          echo "No retained soak ledger; this run starts new cohorts"

      - name: Run the determinism soak
        run: >-
          make gomad3-soak GOMAD3_SOAK_WORKLOAD=${{ matrix.workload }} GOMAD3_SOAK_SEED=${{ matrix.seed }}
          GOMAD3_SOAK_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the soak summary
        if: ${{ always() }}
        run: |
          summary=tools/gomad3/.toolchain/soak/output/soak-summary.md
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the soak ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.GOMAD3_SOAK_LEDGER_ARTIFACT }}
          path: tools/gomad3/.toolchain/soak/ledger
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Upload the soak report and divergence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-soak-darwin-arm64-${{ matrix.workload }}-${{ matrix.seed }}-${{ github.run_id }}
          path: tools/gomad3/.toolchain/soak/output
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  # The linux/amd64 counterpart. soak.json lists linux/amd64 under
  # informational_platforms while fn-105 D12 is open, so this job's report says
  # its gate is informational and a divergence does not fail it; overflow,
  # target, and infrastructure failures still do. fn-105 R12 removes that entry
  # together with the other D12 allowances.
  determinism-soak-linux:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        workload: [functional-activity, functional-child-workflow, functional-update, user-timers-workflow, frontend-system-info]
        seed: [11, 17]
    env:
      GOMAD3_SOAK_LEDGER_ARTIFACT: gomad3-soak-ledger-linux-amd64-${{ matrix.workload }}-${{ matrix.seed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: false
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64

      - name: Restore the soak ledger from the latest retained run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ledger=tools/gomad3/.toolchain/soak/ledger
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow gomad3.yml --branch "$GITHUB_REF_NAME" --limit 50 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            test "$run" = "$GITHUB_RUN_ID" && continue
            rm -rf "$ledger"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$GOMAD3_SOAK_LEDGER_ARTIFACT" --dir "$ledger"; then
              echo "Restored the soak ledger from run $run"
              exit 0
            fi
          done
          rm -rf "$ledger"
          echo "No retained soak ledger; this run starts new cohorts"

      - name: Run the determinism soak (informational while D12 is open)
        run: >-
          make gomad3-soak GOMAD3_SOAK_WORKLOAD=${{ matrix.workload }} GOMAD3_SOAK_SEED=${{ matrix.seed }}
          GOMAD3_SOAK_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the soak summary
        if: ${{ always() }}
        run: |
          summary=tools/gomad3/.toolchain/soak/output/soak-summary.md
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the soak ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.GOMAD3_SOAK_LEDGER_ARTIFACT }}
          path: tools/gomad3/.toolchain/soak/ledger
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Upload the soak report and divergence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-soak-linux-amd64-${{ matrix.workload }}-${{ matrix.seed }}-${{ github.run_id }}
          path: tools/gomad3/.toolchain/soak/output
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
