name: Gomad v3

on:
  pull_request:
    paths:
      - ".github/workflows/gomad.yml"
      - ".github/workflows/gomad-smoke.yml"
      - ".github/.golangci.yml"
      - "cmd/tools/lintcode/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad/**"
      - "tools/gomad/internal/model/cluster/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gomad.yml"
      - ".github/workflows/gomad-smoke.yml"
      - ".github/.golangci.yml"
      - "cmd/tools/lintcode/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad/**"
      - "tools/gomad/internal/model/cluster/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: gomad-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
      wasm: ${{ steps.paths.outputs.wasm }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Select backend gates
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          native=true
          wasm=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            paths_file=$(mktemp)
            trap 'rm -f "$paths_file"' EXIT
            diff_base=$BASE_SHA
            if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] &&
              git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
              if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
                diff_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || exit 1
              fi
              if git diff --no-renames --name-only -z "$diff_base" "$HEAD_SHA" -- > "$paths_file"; then
                native=false
                wasm=false
                runtime=tools/gomad/internal/backends/native/toolchain/runtime
                while IFS= read -r -d '' path; do
                  case "$path" in
                    tools/gomad/internal/backends/wasm/*) wasm=true ;;
                    tools/gomad/internal/backends/native/*)
                      native=true
                      # These native sources also feed the WASM runtime and projected models.
                      case "$path" in
                        "$runtime/overlay/src/internal/gomadfs/fs.go"|\
                        "$runtime/overlay/src/internal/gomadfs/handles.go"|\
                        "$runtime/overlay/src/internal/gomadfs/local_handles.go"|\
                        "$runtime/overlay/src/internal/gomadfs/volume.go"|\
                        "$runtime/overlay/src/internal/gomadchoicewire/hash.go"|\
                        "$runtime/overlay/src/internal/gomadchoicewire/wire_generated.go"|\
                        "$runtime/overlay/src/internal/gomadio/network.go"|\
                        "$runtime/overlay/src/internal/gomadio/network_connection.go"|\
                        "$runtime/overlay/src/internal/gomadio/simulation_network.go"|\
                        "$runtime/overlay/src/internal/gomadio/simulation_handles.go"|\
                        "$runtime/overlay/src/internal/gomadio/simulation_wire.go"|\
                        "$runtime/overlay/src/runtime/gomad.go"|\
                        "$runtime/go1.27.1.patch"|\
                        tools/gomad/internal/backends/native/transcript/schema/*|\
                        tools/gomad/internal/backends/native/generation/protocol/*) wasm=true ;;
                      esac
                      ;;
                    # internal/backends/wasm/cluster and qualification import tools/gomad/internal/model/cluster.
                    tools/gomad/*|tools/gomad/internal/model/cluster/*|.github/workflows/gomad.yml|.github/workflows/gomad-smoke.yml|Makefile|go.mod|go.sum)
                      native=true
                      wasm=true
                      ;;
                    *) native=true ;;
                  esac
                done < "$paths_file"
              fi
            fi
          fi
          printf 'native=%s\nwasm=%s\n' "$native" "$wasm" >> "$GITHUB_OUTPUT"

  wasm-linux:
    needs: changes
    if: ${{ needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: tools/gomad/go.sum

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Restore WASM helper build cache
        id: helper-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/gomad/internal/backends/wasm/wasmhost/target
          key: gomad-wasm-${{ runner.os }}-${{ runner.arch }}-rust1.94.1-${{ hashFiles('tools/gomad/internal/backends/wasm/wasmhost/Cargo.lock', 'tools/gomad/internal/backends/wasm/wasmhost/Cargo.toml', 'tools/gomad/internal/backends/wasm/wasmhost/src/**') }}
          restore-keys: |
            gomad-wasm-${{ runner.os }}-${{ runner.arch }}-rust1.94.1-

      - name: Build pinned WASM helper
        run: cargo +1.94.1 build --manifest-path tools/gomad/internal/backends/wasm/wasmhost/Cargo.toml --release --locked

      - name: Test WASM with stock Go
        run: GOMAD_STOCK_GO="$(command -v go)" make -C tools/gomad test-wasm

      - name: Save WASM helper build cache
        if: ${{ steps.helper-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/gomad/internal/backends/wasm/wasmhost/target
          key: ${{ steps.helper-cache.outputs.cache-primary-key }}

  host-tools-linux:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' || needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true

      - name: Build and vet the default host set
        working-directory: tools/gomad
        run: go build ./... && go vet ./...

      - name: Validate generated outputs, patches, scripts, compatibility packs, and the ./tests qualification manifest
        working-directory: tools/gomad
        run: make validate

      - name: Lint Gomad host module
        run: make GOLANGCI_LINT_FIX=false GOLANGCI_LINT_BASE_REV=HEAD~ lint-code-gomad

      - name: Test platform-neutral host tooling
        working-directory: tools/gomad
        run: >-
          go test -count=1 -tags test_dep
          ./internal/host/exec
          ./internal/host/fs
          ./cmd/gomad/internal/cli ./internal/runner/... ./internal/archcheck

      - name: Test native host tooling under the native selection
        if: ${{ needs.changes.outputs.native == 'true' }}
        working-directory: tools/gomad
        run: >-
          go test -count=1 -tags test_dep,gomad_native
          go.temporal.io/server/tools/gomad/internal/backends/native/cmd/gomadtool

  core-linux:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOFLAGS: -tags=gomad_native
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64

      - name: Build the toolchain and run the conformance tiers qualified on Linux
        run: >-
          make -C tools/gomad test-harness test-toolchain intercept-test overlay-test test-simulation
          world-test test-builder test-live-capability test-upstream test-runtime

      - name: Run the host tier
        run: make -C tools/gomad test-host

      - name: Qualify the Linux compatibility packs and the core corpus
        run: make -C tools/gomad compatibility-pack-qualification core-qualification-set

      - name: Verify portable core qualification evidence
        run: >-
          jq -e '
          .schema == "gomad.qualification-set-report/v1" and
          .platform == {"goos": "linux", "goarch": "amd64"} and
          .seeds == ["17"] and .expectations_met and
          .selected == 7 and .completed == 7 and .supported == 7 and
          .unsupported == 0 and .failed == 0 and .infrastructure_errors == 0 and
          ([.workloads[] | select(.classification == "qualified") | .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad/.toolchain/core-qualification-set.json

      - name: Upload core qualification
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-linux-qualification-${{ github.run_id }}
          path: |
            tools/gomad/.toolchain/core-qualification-set.json
            tools/gomad/.toolchain/core-qualification
          if-no-files-found: error
          retention-days: 90

      # The functional test package's capability closure is closed on Linux under
      # the gomad build tag (MILESTONES.md F4): build seams cut the server's
      # host-only providers and the fx, SDK, otel, and gRPC adapters remove the
      # remaining forbidden imports, so closure mode reports zero blockers.
      - name: Close the functional test capability closure
        run: >-
          make gomad-runner &&
          tools/gomad/.bin/gomad analyze --capability-mode=closure --format=json --timeout=15m
          --build-tag disable_grpc_modules --build-tag gomad --build-tag test_dep
          go-test ./tests > tools/gomad/.toolchain/tests-closure.json;
          jq -e '
          .classification == "supported" and (.blockers | length) == 0 and
          ([.packs[].id] | index("temporal-functional-tests-linux-amd64") != null)
          ' tools/gomad/.toolchain/tests-closure.json

      # The Temporal corpus on Linux: the ten expected boundaries hold (the amd64
      # xxhash assembly, which the darwin-scoped temporal-leaf packs do not
      # admit), and the other eighteen workloads are supported. The five package
      # suites, the tier 3 user-timers and activity batch cancel suites, and the
      # ten `functional-*` suites of the F6 slice qualify with exact replay on
      # both seeds. The tier 3 probe runs to a successful exit under guarded
      # mode, but one run's seed 17 did not reproduce its evidence, so
      # temporal.json states its linux/amd64 expectation as `intermittent` until
      # MILESTONES.md F3 closes it. Since the FIPS DRBG and mark-start
      # greying runtime changes, seed 17 of one functional suite per run has
      # diverged on replay, a different suite each time, so the F5 and F6
      # suites are `intermittent` on linux under the F7 finding too.
      - name: Requalify representative Temporal workloads
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: make gomad-qualification

      - name: Verify portable Temporal qualification evidence
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: >-
          jq -e '
          .schema == "gomad.qualification-set-report/v1" and
          .platform == {"goos": "linux", "goarch": "amd64"} and
          .seeds == ["11", "17"] and .expectations_met and
          .selected == 28 and .completed == 28 and .unsupported == 10 and
          (.supported + .failed) == 18 and
          .infrastructure_errors == 0 and
          ([.workloads[] | select(.id == "frontend-system-info" or .id == "user-timers-workflow" or .id == "activity-batch-cancel-boundary" or (.id | startswith("functional-"))) | .classification == "qualified" or .classification == "nondeterministic" or .classification == "replay_divergence"] | all) and
          ([.workloads[] | select(.classification == "qualified") |
          (.seeds | length) == 2 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad/.toolchain/temporal-qualification-set.json

      - name: Upload Temporal qualification
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-linux-temporal-qualification-${{ github.run_id }}
          path: tools/gomad/.toolchain/temporal-qualification-set.json
          if-no-files-found: error
          retention-days: 90

  core:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GOFLAGS: -tags=gomad_native
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Produce checked upgrade qualification dossier
        env:
          GOMAD_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          GOMAD_APPROVED_BOUNDARY_DIFF_SHA256: ${{ vars.GOMAD_APPROVED_BOUNDARY_DIFF_SHA256 }}
        run: make -C tools/gomad upgrade-dossier

      - name: Run the simulation tier
        run: make -C tools/gomad test-simulation

      - name: Verify portable core qualification evidence
        run: >-
          jq -e '
          .schema == "gomad.qualification-set-report/v1" and
          .seeds == ["17"] and
          .selected == 7 and .completed == 7 and .supported == 7 and
          .unsupported == 0 and .failed == 0 and .infrastructure_errors == 0 and
          ([.workloads[] | .classification == "qualified" and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad/.toolchain/core-qualification-set.json

      - name: Upload upgrade qualification dossier
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-qualification-${{ github.run_id }}
          path: |
            tools/gomad/.toolchain/upgrade-dossier.json
            tools/gomad/.toolchain/core-qualification-set.json
            tools/gomad/.toolchain/core-qualification
          if-no-files-found: error
          retention-days: 90

      # The darwin/arm64 counterpart of the Linux closure step (MILESTONES.md
      # F4 states its acceptance on darwin/arm64): the arm64 assembly and the
      # Prometheus client's darwin process-collector imports are admitted by
      # the darwin packs, so closure mode reports zero blockers.
      - name: Close the functional test capability closure
        run: >-
          make gomad-runner &&
          tools/gomad/.bin/gomad analyze --capability-mode=closure --format=json --timeout=15m
          --build-tag disable_grpc_modules --build-tag gomad --build-tag test_dep
          go-test ./tests > tools/gomad/.toolchain/tests-closure.json;
          jq -e '
          .classification == "supported" and (.blockers | length) == 0 and
          ([.packs[].id] | index("temporal-functional-tests-darwin-arm64") != null)
          ' tools/gomad/.toolchain/tests-closure.json

  functional-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.native == 'true' }}
    uses: ./.github/workflows/gomad-smoke.yml

  temporal-integration:
    needs: core
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GOFLAGS: -tags=gomad_native
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: true
          cache: true

      - name: Test Temporal wrapper contract
        run: make gomad-integration-test

      - name: Requalify representative Temporal workloads
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: make gomad-qualification

      # The tier 3 classifications are asserted through the manifest's
      # expectations, so this job goes red the moment a real darwin result
      # disagrees with what temporal.json states. On darwin the tier 3 frontend
      # probe is `qualified` with exact replay, every tier 2 package suite
      # qualifies (nine under the gomad tag, through the temporal-leaf packs),
      # and the tier 3 user-timers and activity batch cancel suites are
      # `qualified` with exact replay on both seeds since the mark-start
      # greying fix MILESTONES.md F5 records, as are the ten
      # `functional-*` suites of the F6 slice, so all 28 are supported.
      - name: Verify portable Temporal qualification evidence
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: >-
          jq -e '
          .schema == "gomad.qualification-set-report/v1" and
          .platform == {"goos": "darwin", "goarch": "arm64"} and
          .seeds == ["11", "17"] and .expectations_met and
          .selected == 28 and .completed == 28 and .unsupported == 0 and
          .supported == 28 and .failed == 0 and
          .infrastructure_errors == 0 and
          ([.workloads[] | select(.tier == 2 and .classification == "qualified")] | length) == 15 and
          ([.workloads[] | select(.tier == 3 and .classification == "qualified")] | length) == 13 and
          ([.workloads[] | select(.classification == "qualified") |
          (.seeds | length) == 2 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad/.toolchain/temporal-qualification-set.json

      - name: Upload Temporal qualification
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-temporal-qualification-${{ github.run_id }}
          path: |
            tools/gomad/.toolchain/temporal-qualification-set.json
            tools/gomad/.toolchain/temporal-qualification
          if-no-files-found: error
          retention-days: 90

  # The scheduled determinism soak (fn-112 R6, MILESTONES.md Q6). Each job runs
  # one workload and seed of tools/gomad/internal/backends/native/qualification/soak.json:
  # N fresh same-seed repetitions in gomad qualify batches of 32, under two busy
  # host threads, with choice tracing and diagnostics on. Every batch is
  # compared with its cohort's baseline (workload, seed, platform, execution
  # identity), carried between runs in a ledger restored from the latest
  # retained scheduled or dispatched run; a new toolchain identity starts a new
  # cohort. The darwin gate accepts zero divergences, and an overflow, target
  # failure, or infrastructure failure fails it separately. A divergence
  # uploads both diagnostic traces and the differ output.
  # soak.json caps a job at four batches inside a 120-minute budget, so the
  # matrix stays within a fork's shared macOS quota. Each job builds its own
  # toolchain, as every other gomad job does.
  determinism-soak-darwin:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        workload: [functional-activity, functional-child-workflow, functional-update, user-timers-workflow, frontend-system-info]
        seed: [11, 17]
    env:
      GOFLAGS: -tags=gomad_native
      GOMAD_SOAK_LEDGER_ARTIFACT: gomad-soak-ledger-darwin-arm64-${{ matrix.workload }}-${{ matrix.seed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Restore the soak ledger from the latest retained run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ledger=tools/gomad/.toolchain/soak/ledger
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow gomad.yml --branch "$GITHUB_REF_NAME" --limit 50 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            test "$run" = "$GITHUB_RUN_ID" && continue
            rm -rf "$ledger"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$GOMAD_SOAK_LEDGER_ARTIFACT" --dir "$ledger"; then
              echo "Restored the soak ledger from run $run"
              exit 0
            fi
          done
          rm -rf "$ledger"
          echo "No retained soak ledger; this run starts new cohorts"

      - name: Run the determinism soak
        run: >-
          make gomad-soak GOMAD_SOAK_WORKLOAD=${{ matrix.workload }} GOMAD_SOAK_SEED=${{ matrix.seed }}
          GOMAD_SOAK_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the soak summary
        if: ${{ always() }}
        run: |
          summary=tools/gomad/.toolchain/soak/output/soak-summary.md
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the soak ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.GOMAD_SOAK_LEDGER_ARTIFACT }}
          path: tools/gomad/.toolchain/soak/ledger
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Upload the soak report and divergence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-soak-darwin-arm64-${{ matrix.workload }}-${{ matrix.seed }}-${{ github.run_id }}
          path: tools/gomad/.toolchain/soak/output
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  # The linux/amd64 counterpart. soak.json lists linux/amd64 under
  # informational_platforms while fn-105 D12 is open, so this job's report says
  # its gate is informational and a divergence does not fail it; overflow,
  # target, and infrastructure failures still do. Deferred fn-128.2 owns removal of that entry
  # together with the other D12 allowances.
  determinism-soak-linux:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        workload: [functional-activity, functional-child-workflow, functional-update, user-timers-workflow, frontend-system-info]
        seed: [11, 17]
    env:
      GOFLAGS: -tags=gomad_native
      GOMAD_SOAK_LEDGER_ARTIFACT: gomad-soak-ledger-linux-amd64-${{ matrix.workload }}-${{ matrix.seed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64

      - name: Restore the soak ledger from the latest retained run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ledger=tools/gomad/.toolchain/soak/ledger
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow gomad.yml --branch "$GITHUB_REF_NAME" --limit 50 \
            --json databaseId,event --jq '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            test "$run" = "$GITHUB_RUN_ID" && continue
            rm -rf "$ledger"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$GOMAD_SOAK_LEDGER_ARTIFACT" --dir "$ledger"; then
              echo "Restored the soak ledger from run $run"
              exit 0
            fi
          done
          rm -rf "$ledger"
          echo "No retained soak ledger; this run starts new cohorts"

      - name: Run the determinism soak (informational while D12 is open)
        run: >-
          make gomad-soak GOMAD_SOAK_WORKLOAD=${{ matrix.workload }} GOMAD_SOAK_SEED=${{ matrix.seed }}
          GOMAD_SOAK_RUN_ID=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish the soak summary
        if: ${{ always() }}
        run: |
          summary=tools/gomad/.toolchain/soak/output/soak-summary.md
          if test -f "$summary"; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the soak ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ env.GOMAD_SOAK_LEDGER_ARTIFACT }}
          path: tools/gomad/.toolchain/soak/ledger
          if-no-files-found: ignore
          retention-days: 90
          overwrite: true

      - name: Upload the soak report and divergence evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad-soak-linux-amd64-${{ matrix.workload }}-${{ matrix.seed }}-${{ github.run_id }}
          path: tools/gomad/.toolchain/soak/output
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
