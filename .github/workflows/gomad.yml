name: Gomad v3

on:
  pull_request:
    paths:
      - ".github/workflows/gomad.yml"
      - ".github/.golangci.yml"
      - "cmd/tools/lintcode/**"
      - "Makefile"
      - "tools/gomad/mise.toml"
      - "go.mod"
      - "go.sum"
      - "tools/gomad/**"
      - "tools/gomad/internal/model/cluster/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gomad.yml"
      - ".github/.golangci.yml"
      - "cmd/tools/lintcode/**"
      - "Makefile"
      - "tools/gomad/mise.toml"
      - "go.mod"
      - "go.sum"
      - "tools/gomad/**"
      - "tools/gomad/internal/model/cluster/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: gomad-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wasm: ${{ steps.paths.outputs.wasm }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Select backend gates
        id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          wasm=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then
            paths_file=$(mktemp)
            trap 'rm -f "$paths_file"' EXIT
            diff_base=$BASE_SHA
            if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ && "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] &&
              git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
              if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
                diff_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || exit 1
              fi
              if git diff --no-renames --name-only -z "$diff_base" "$HEAD_SHA" -- > "$paths_file"; then
                wasm=false
                while IFS= read -r -d '' path; do
                  case "$path" in
                    tools/gomad/internal/backends/wasm/*|tools/gomad/mise.toml) wasm=true ;;
                    # internal/backends/wasm/cluster and qualification import tools/gomad/internal/model/cluster.
                    # The gomad_wasm_slim provider seams carry the WASM slim refusal tests.
                    tools/gomad/*|tools/gomad/internal/model/cluster/*|.github/workflows/gomad.yml|.github/.golangci.yml|cmd/tools/lintcode/*|Makefile|go.mod|go.sum|\
                    common/archiver/provider/provider_cloud*|temporal/membership*|tests/testcore/flag_sql*)
                      wasm=true
                      ;;
                    *) ;;
                  esac
                done < "$paths_file"
              fi
            fi
          fi
          printf 'wasm=%s\n' "$wasm" >> "$GITHUB_OUTPUT"

  wasm-linux:
    needs: changes
    if: ${{ needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: tools/gomad/go.sum

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Restore Rust workspace build cache
        id: helper-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/gomad/rust/target
          key: gomad-wasm-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ hashFiles('tools/gomad/rust/Cargo.lock', 'tools/gomad/rust/Cargo.toml', 'tools/gomad/rust/rust-toolchain.toml', 'tools/gomad/rust/*/Cargo.toml', 'tools/gomad/rust/*/build.rs', 'tools/gomad/rust/*/src/**') }}
          restore-keys: |
            gomad-wasm-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-

      - name: Check Rust formatting and Clippy
        run: make -C tools/gomad/internal/backends/wasm lint-rust

      - name: Build Rust host
        run: make -C tools/gomad build

      - name: Test slim guest refusals with stock Go
        # go test -tags gomad_wasm_slim,test_dep -run <refusal tests> ./common/archiver/provider ./temporal ./tests/testcore
        run: GOMAD_STOCK_GO="$(command -v go)" make -C tools/gomad test-wasm-slim-refusals

      - name: Test WASM with stock Go
        run: GOMAD_STOCK_GO="$(command -v go)" make -C tools/gomad test-wasm

      - name: Save Rust workspace build cache
        if: ${{ steps.helper-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/gomad/rust/target
          key: ${{ steps.helper-cache.outputs.cache-primary-key }}

  reference-tools-linux:
    needs: changes
    if: ${{ needs.changes.outputs.wasm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad/go.mod
          check-latest: false
          cache: true

      - name: Build and vet retained Go reference tools
        working-directory: tools/gomad
        run: go build ./... && go vet ./...

      - name: Validate the shared generated protocol outputs
        working-directory: tools/gomad
        run: make validate

      - name: Lint Gomad host module
        run: make GOLANGCI_LINT_FIX=false GOLANGCI_LINT_BASE_REV=HEAD~ lint-code-gomad

      - name: Test retained reference tooling
        working-directory: tools/gomad
        run: >-
          go test -count=1 -tags test_dep
          ./internal/model/... ./internal/support/... ./internal/archcheck
