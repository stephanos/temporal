name: Umpire3
on:
  pull_request:
    paths:
      - ".github/workflows/umpire3.yml"
      - "tools/umpire3/**"
      - ".plans/UMPIRE3.md"
      - "Makefile"
  push:
    branches:
      - stephanos/umpire
permissions:
  contents: read
concurrency:
  group: umpire3-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          cache: true
      - uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          working_directory: tools/umpire3/model
      - name: Verify Umpire3
        run: make umpire3-check
      - name: Run real-cluster Umpire3 integration
        run: make umpire3-integration
