name: Gomad v3 functional smoke

# The required functional-test gate (MILESTONES.md F7). It qualifies a
# small, named selection of ./tests suites on linux/amd64 so that a change to the
# server, the functional test harness, or Gomad itself cannot silently break
# deterministic execution. The full ./tests set is not run in CI; it stays the
# on-demand local gate `make gomad3-tests-qualification`.
on:
  pull_request:
    paths:
      - ".github/workflows/gomad3-smoke.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad3/**"
      - "tools/gomad3integration/**"
      - "tests/**"
      - "chasm/**"
      - "client/**"
      - "common/**"
      - "components/**"
      - "schema/**"
      - "service/**"
      - "temporal/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gomad3-smoke.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomad3/**"
      - "tools/gomad3integration/**"
      - "tests/**"
      - "chasm/**"
      - "client/**"
      - "common/**"
      - "components/**"
      - "schema/**"
      - "service/**"
      - "temporal/**"
  workflow_dispatch:
  # gomad3.yml calls this workflow so a dispatch of the main Gomad workflow runs
  # the smoke gate too.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow names the caller when gomad3.yml calls this workflow, so the
  # direct and the called run of one pull request do not cancel each other.
  group: gomad3-smoke-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  functional-smoke-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: false
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64

      # A test added to ./tests without regenerating tests.json fails here, so
      # every functional test keeps a disposition.
      - name: Check the ./tests qualification manifest is current
        run: make -C tools/gomad3 validate-qualification

      - name: Qualify the functional smoke selection
        run: make gomad3-smoke-qualification

      # Every smoke suite runs to success on seed 11 with zero unsupported and
      # infrastructure errors, read separately per COMPAT-2. A suite may be
      # nondeterministic or diverge on replay under the open linux replay
      # finding (MILESTONES.md "Open findings"); a qualified suite must
      # replay exactly, and any target failure fails the gate.
      - name: Verify functional smoke evidence
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .platform == {"goos": "linux", "goarch": "amd64"} and
          .seeds == ["11"] and .expectations_met and
          .selected == 4 and .completed == 4 and (.supported + .failed) == 4 and
          .unsupported == 0 and .infrastructure_errors == 0 and
          ([.workloads[] | .classification == "qualified" or .classification == "nondeterministic" or .classification == "replay_divergence"] | all) and
          ([.workloads[] | select(.classification == "qualified") |
          (.seeds | length) == 1 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .replayed and .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/smoke-qualification-set.json

      - name: Upload functional smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-functional-smoke-${{ github.run_id }}
          path: tools/gomad3/.toolchain/smoke-qualification-set.json
          if-no-files-found: error
          retention-days: 30

  # The darwin/arm64 counterpart of the Linux job (MILESTONES.md F10 D7):
  # the same triggers, the same manifest check, and the same smoke selection on
  # a standard GitHub-hosted macOS runner.
  functional-smoke-darwin:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomad3/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Check the ./tests qualification manifest is current
        run: make -C tools/gomad3 validate-qualification

      # Routine full-suite qualification runs untraced (MILESTONES.md F10
      # D13), so this representative replay gate states its tracing itself: a
      # suite without a choice trace and replayed successes could only show seed
      # repeatability, which the evidence check below does not accept.
      - name: Check the smoke selection is explicitly traced
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set/v3" and
          .seeds == [11] and (.suites | length) == 4 and
          ([.suites[] | .choice_bytes > 0 and .replay_successes == true] | all)
          ' tools/gomad3integration/qualification/smoke.json

      - name: Qualify the functional smoke selection
        run: make gomad3-smoke-qualification

      # Stricter than the Linux check: the open linux replay finding does not
      # extend to darwin, so every smoke suite must be `qualified` on seed 11
      # with verified exact choice-tape replay. A nondeterministic or
      # replay-diverged suite fails the gate here and stays required work under
      # MILESTONES.md F10 D12/D14.
      - name: Verify functional smoke evidence
        run: >-
          jq -e '
          .schema == "gomad3.qualification-set-report/v1" and
          .platform == {"goos": "darwin", "goarch": "arm64"} and
          .seeds == ["11"] and .expectations_met and
          .selected == 4 and .completed == 4 and .supported == 4 and
          .unsupported == 0 and .failed == 0 and .infrastructure_errors == 0 and
          .replay_diverged == 0 and (.workloads | length) == 4 and
          ([.workloads[] | .classification == "qualified" and
          (.seeds | length) == 1 and .choice.available and
          .choice.exact_replay_available and
          ([.seeds[] | .classification == "qualified" and .replayed and
          .replay_match and .choice_replay_exact] | all)] | all)
          ' tools/gomad3/.toolchain/smoke-qualification-set.json

      - name: Upload functional smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomad3-functional-smoke-darwin-arm64-${{ github.run_id }}
          path: |
            tools/gomad3/.toolchain/smoke-qualification-set.json
            tools/gomad3/.toolchain/smoke-qualification
          if-no-files-found: error
          retention-days: 30
