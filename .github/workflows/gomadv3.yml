name: Gomad v3

on:
  pull_request:
    paths:
      - ".github/workflows/gomadv3.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomadv3/**"
      - "tools/gomadv3integration/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gomadv3.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "tools/gomadv3/**"
      - "tools/gomadv3integration/**"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: gomadv3-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  host-tools-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomadv3/go.mod
          check-latest: false
          cache: true

      - name: Test platform-neutral host tooling
        working-directory: tools/gomadv3
        run: >-
          go test -count=1 -tags test_dep
          ./internal/outputcapture
          ./internal/commandrun
          ./internal/sourcearchive
          ./internal/patchset
          ./internal/toolchainbuild
          ./internal/testtier
          ./internal/testdriver
          ./internal/scriptpolicy
          ./internal/hosttool

  core:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/gomadv3/go.mod
          check-latest: true
          cache: true

      - name: Verify qualified host
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = darwin/arm64

      - name: Produce checked upgrade qualification dossier
        env:
          GOMADV3_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          GOMADV3_APPROVED_BOUNDARY_DIFF_SHA256: ${{ vars.GOMADV3_APPROVED_BOUNDARY_DIFF_SHA256 }}
        run: make -C tools/gomadv3 upgrade-dossier

      - name: Upload upgrade qualification dossier
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomadv3-qualification-${{ github.run_id }}
          path: |
            tools/gomadv3/.toolchain/upgrade-dossier.json
            tools/gomadv3/.toolchain/core-qualification-set.json
            tools/gomadv3/.toolchain/core-qualification
          if-no-files-found: error
          retention-days: 90

  temporal-integration:
    needs: core
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test Temporal wrapper contract
        run: make gomadv3-integration-test

      - name: Requalify representative Temporal workloads
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: make gomadv3-qualification

      - name: Upload Temporal qualification
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gomadv3-temporal-qualification-${{ github.run_id }}
          path: |
            tools/gomadv3/.toolchain/temporal-qualification-set.json
            tools/gomadv3/.toolchain/temporal-qualification
          if-no-files-found: error
          retention-days: 90
